<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astmalääkkeen Seuranta</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; padding:20px; }
        .container { max-width:500px; margin:0 auto; background:white; border-radius:20px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        h1 { color:#667eea; text-align:center; margin-bottom:30px; font-size:28px; }
        .status-card { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; padding:25px; border-radius:15px; margin-bottom:25px; text-align:center; }
        .status-card h2 { font-size:18px; margin-bottom:10px; opacity:0.9; }
        .status-card .big-number { font-size:48px; font-weight:bold; margin:10px 0; }
        .status-card .label { font-size:14px; opacity:0.9; }
        .date-info { background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:20px; }
        .date-info p { margin:8px 0; color:#333; font-size:15px; }
        .date-info strong { color:#667eea; }
        .new-medicine { background:#fff3cd; border:2px solid #ffc107; border-radius:10px; padding:20px; margin-bottom:20px; }
        .new-medicine h3 { color:#856404; margin-bottom:15px; font-size:16px; }
        .new-medicine input { width:100%; padding:12px; border:2px solid #ddd; border-radius:8px; font-size:16px; margin-bottom:10px; }
        button { width:100%; padding:15px; border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer; transition:all 0.3s; margin-bottom:10px; }
        .btn-primary { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 5px 15px rgba(102,126,234,0.4); }
        .btn-success { background:#28a745; color:white; font-size:20px; }
        .btn-success:hover { background:#218838; transform:scale(1.02); }
        .btn-success:disabled { background:#ccc; cursor:not-allowed; transform:none; }
        .btn-secondary { background:#6c757d; color:white; font-size:14px; }
        .btn-secondary:hover { background:#5a6268; }
        .data-buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; padding-top:20px; border-top:2px solid #eee; }
        .taken-today { background:#d4edda; border:2px solid #28a745; padding:15px; border-radius:10px; text-align:center; color:#155724; font-weight:bold; margin-bottom:15px; }
        .warning { background:#f8d7da; border:2px solid #dc3545; padding:15px; border-radius:10px; text-align:center; color:#721c24; font-weight:bold; margin-bottom:15px; }
        .history-section { margin-top:20px; padding-top:20px; border-top:2px solid #eee; }
        .toggle-history { width:100%; padding:12px; background:#f8f9fa; color:#333; border:2px solid #ddd; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; transition:all 0.3s; }
        .toggle-history:hover { background:#e9ecef; }
        .history-list { display:none; margin-top:15px; max-height:400px; overflow-y:auto; background:#f8f9fa; border-radius:10px; padding:15px; }
        .history-list.show { display:block; }
        .day-item { display:flex; justify-content:space-between; align-items:center; padding:12px; margin-bottom:8px; background:white; border-radius:8px; border:2px solid #ddd; }
        .day-item.taken { border-color:#28a745; background:#d4edda; }
        .day-item.missed { border-color:#dc3545; background:#f8d7da; }
        .day-item.future { opacity:0.5; }
        .day-date { font-weight:bold; color:#333; }
        .day-status { font-size:20px; }

        #saveStatus { position:fixed; top:0; left:0; right:0; padding:8px; text-align:center; font-size:13px; font-weight:700; z-index:9998; transition:opacity 0.5s; opacity:0; }

        /* Kirjautumisruutu */
        #loginScreen {
            position:fixed; inset:0;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            display:flex; align-items:center; justify-content:center;
            z-index:9999; padding:20px;
        }
        .login-box {
            background:white; border-radius:20px;
            padding:36px 28px; width:100%; max-width:360px;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
        }
        .login-title { font-size:26px; font-weight:800; color:#667eea; text-align:center; margin-bottom:6px; }
        .login-sub { font-size:14px; color:#888; text-align:center; margin-bottom:24px; }
        .login-box label { display:block; font-size:13px; font-weight:700; color:#444; margin-bottom:5px; }
        .login-box input[type="email"],
        .login-box input[type="password"] {
            width:100%; padding:12px 14px;
            border:2px solid #ddd; border-radius:10px;
            font-size:16px; margin-bottom:14px;
            transition:border 0.2s; outline:none;
        }
        .login-box input:focus { border-color:#667eea; }
        .login-btn {
            width:100%; padding:14px;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color:white; border:none; border-radius:10px;
            font-size:17px; font-weight:700;
            cursor:pointer; transition:opacity 0.2s; margin-bottom:0;
        }
        .login-btn:hover { opacity:0.9; }
        .login-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .login-error { color:#dc3545; font-size:13px; font-weight:700; text-align:center; margin-top:12px; min-height:20px; }

        /* Käyttäjäpalkki */
        .user-bar {
            display:flex; justify-content:space-between; align-items:center;
            background:#f0f4ff; border-radius:10px; padding:10px 14px;
            margin-bottom:20px; font-size:13px; color:#555;
        }
        .user-bar span { font-weight:600; color:#667eea; font-size:12px; }
        .logout-btn {
            background:none; border:none; color:#dc3545;
            font-size:13px; font-weight:700; cursor:pointer;
            width:auto; padding:4px 8px; margin:0;
        }
        .logout-btn:hover { text-decoration:underline; }
    </style>
</head>
<body>

<!-- Kirjautumisruutu -->
<div id="loginScreen">
    <div class="login-box">
        <div class="login-title">💊 Astmalääke</div>
        <div class="login-sub">Kirjaudu sisään jatkaaksesi</div>

        <label for="emailInput">Sähköposti</label>
        <input type="email" id="emailInput" placeholder="sinun@email.fi" autocomplete="username">

        <label for="passwordInput">Salasana</label>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">Kirjaudu sisään</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<div id="saveStatus"></div>

<div class="container">
    <h1>💊 Astmalääkkeen Seuranta</h1>
    <div class="user-bar" id="userBar" style="display:none;">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="handleLogout()">🚪 Kirjaudu ulos</button>
    </div>
    <div id="app"><p style="text-align:center;color:#999;">Ladataan...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDswdEF9J0gsHJH6Zo_8BGZrf8DVG3FwYc",
    authDomain: "hakemuspaivakirja.firebaseapp.com",
    projectId: "hakemuspaivakirja",
    storageBucket: "hakemuspaivakirja.firebasestorage.app",
    messagingSenderId: "836133210317",
    appId: "1:836133210317:web:d85131ae272ecf1938c184"
};

const app      = initializeApp(firebaseConfig);
const db       = getFirestore(app);
const auth     = getAuth(app);
const DATA_DOC = doc(db, "astmalaake", "data");

let data = { startDate: null, doses: {} };
let isSaving = false;
let unsubSnapshot = null;

// ============================
// AUTH STATE
// ============================
onAuthStateChanged(auth, user => {
    if(user){
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('userEmail').textContent = user.email;
        loadFromFirebase();
    } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('userBar').style.display = 'none';
        document.getElementById('app').innerHTML = '<p style="text-align:center;color:#999;">Ladataan...</p>';
        if(unsubSnapshot){ unsubSnapshot(); unsubSnapshot = null; }
    }
});

// ============================
// KIRJAUTUMINEN
// ============================
window.handleLogin = async () => {
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn      = document.getElementById('loginBtn');
    const err      = document.getElementById('loginError');

    if(!email || !password){ err.textContent = "Syötä sähköposti ja salasana."; return; }

    btn.disabled = true;
    btn.textContent = "Kirjaudutaan...";
    err.textContent = "";

    try {
        await signInWithEmailAndPassword(auth, email, password);
    } catch(e){
        btn.disabled = false;
        btn.textContent = "Kirjaudu sisään";
        if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'){
            err.textContent = "Väärä sähköposti tai salasana.";
        } else if(e.code === 'auth/too-many-requests'){
            err.textContent = "Liian monta yritystä. Yritä myöhemmin.";
        } else {
            err.textContent = "Kirjautuminen epäonnistui. (" + e.code + ")";
        }
    }
};

// Enter-näppäin
document.getElementById('passwordInput').addEventListener('keydown', e => { if(e.key==='Enter') window.handleLogin(); });
document.getElementById('emailInput').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('passwordInput').focus(); });

// ============================
// ULOSKIRJAUTUMINEN
// ============================
window.handleLogout = async () => {
    if(confirm('Haluatko kirjautua ulos?')) await signOut(auth);
};

// ============================
// TALLENNUSINDIKAATTORI
// ============================
function showSaveStatus(msg, color){
    const el = document.getElementById('saveStatus');
    el.textContent = msg;
    el.style.background = color || '#667eea';
    el.style.color = 'white';
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 2000);
}

// ============================
// FIREBASE TALLENNUS
// ============================
async function saveData(){
    if(isSaving) return;
    isSaving = true;
    showSaveStatus('💾 Tallennetaan...', '#f97316');
    try {
        localStorage.setItem('astmalaake_bkp', JSON.stringify(data));
        await setDoc(DATA_DOC, { json: JSON.stringify(data) });
        showSaveStatus('✅ Tallennettu', '#22c55e');
    } catch(e){
        showSaveStatus('❌ Tallennus epäonnistui', '#dc2626');
        console.error(e);
    }
    isSaving = false;
}

// ============================
// FIREBASE LATAUS
// ============================
async function loadFromFirebase(){
    try {
        const snap = await getDoc(DATA_DOC);
        if(snap.exists()){
            data = JSON.parse(snap.data().json) || { startDate:null, doses:{} };
        } else {
            const bkp = localStorage.getItem('astmalaake_bkp');
            if(bkp) try { data = JSON.parse(bkp); await saveData(); } catch(e){ data={startDate:null,doses:{}}; }
        }
    } catch(e){
        const bkp = localStorage.getItem('astmalaake_bkp');
        if(bkp) try { data = JSON.parse(bkp); } catch(e2){}
        showSaveStatus('⚠️ Yhteysvirhe – paikallinen data', '#f59e0b');
    }
    render();
    if(unsubSnapshot) unsubSnapshot();
    unsubSnapshot = onSnapshot(DATA_DOC, snap => {
        if(!snap.exists() || isSaving) return;
        try { data = JSON.parse(snap.data().json) || {startDate:null,doses:{}}; render(); } catch(e){}
    });
}

// ============================
// APUFUNKTIOT
// ============================
function getTodayString(){ return new Date().toISOString().split('T')[0]; }
function formatDate(dateStr){ return new Date(dateStr+'T12:00:00').toLocaleDateString('fi-FI'); }
function getDaysRemaining(){
    if(!data.startDate) return 100;
    const end = new Date(data.startDate+'T12:00:00');
    end.setDate(end.getDate()+100);
    return Math.max(0, Math.ceil((end-new Date())/(1000*60*60*24)));
}
function getEndDate(){
    if(!data.startDate) return null;
    const end = new Date(data.startDate+'T12:00:00');
    end.setDate(end.getDate()+100);
    return end.toISOString().split('T')[0];
}

// ============================
// TOIMINNOT
// ============================
window.startNewMedicine = async (dateStr) => {
    if(confirm('Haluatko varmasti aloittaa uuden lääkepakkauksen?')){
        data.startDate = dateStr; data.doses = {};
        await saveData(); render();
    }
};
window.markDoseTaken = async () => {
    data.doses[getTodayString()] = true;
    await saveData(); render();
};
window.toggleHistory = () => document.getElementById('historyList').classList.toggle('show');
window.exportData = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    a.download = 'astmalaake-'+getTodayString()+'.json';
    a.click(); URL.revokeObjectURL(a.href);
};
window.importData = () => {
    const input = document.createElement('input');
    input.type='file'; input.accept='application/json';
    input.onchange = async e => {
        const reader = new FileReader();
        reader.onload = async evt => {
            try { data=JSON.parse(evt.target.result); await saveData(); render(); alert('Tiedot tuotu!'); }
            catch(err){ alert('Virhe tuotaessa tietoja!'); }
        };
        reader.readAsText(e.target.files[0]);
    };
    input.click();
};

function generateDayHistory(){
    if(!data.startDate) return '';
    const start = new Date(data.startDate+'T12:00:00');
    const end = new Date(start); end.setDate(end.getDate()+100);
    const today = new Date();
    let html='', cur=new Date(end);
    while(cur>=start){
        const dateStr=cur.toISOString().split('T')[0];
        const isFuture=cur>today, isTaken=data.doses[dateStr];
        const cls=isFuture?'future':isTaken?'taken':'missed';
        const icon=isFuture?'⏳':isTaken?'✅':'❌';
        html+=`<div class="day-item ${cls}"><span class="day-date">${formatDate(dateStr)}</span><span class="day-status">${icon}</span></div>`;
        cur.setDate(cur.getDate()-1);
    }
    return html;
}

// ============================
// RENDER
// ============================
function render(){
    const today=getTodayString(), takenToday=data.doses[today];
    const daysRemaining=getDaysRemaining(), endDate=getEndDate();
    let html='';
    if(!data.startDate){
        html=`<div class="new-medicine"><h3>🆕 Aloita uusi lääkepakkaus</h3>
            <input type="date" id="startDate" value="${today}">
            <button class="btn-primary" onclick="startNewMedicine(document.getElementById('startDate').value)">Aloita seuranta</button>
            </div>`;
    } else {
        html=`<div class="status-card"><h2>Lääke loppuu</h2>
            <div class="big-number">${daysRemaining}</div>
            <div class="label">päivän kuluttua</div></div>
            ${daysRemaining<=7?'<div class="warning">⚠️ Lääke loppuu pian! Tilaa uusi pakkaus.</div>':''}
            ${takenToday?'<div class="taken-today">✅ Olet ottanut tänään lääkkeen!</div>':''}
            <div class="date-info">
                <p><strong>Aloituspäivä:</strong> ${formatDate(data.startDate)}</p>
                <p><strong>Loppumispäivä:</strong> ${formatDate(endDate)}</p>
                <p><strong>Tänään:</strong> ${formatDate(today)}</p>
            </div>
            <button class="btn-success" onclick="markDoseTaken()" ${takenToday?'disabled':''}>
                ${takenToday?'✅ Lääke otettu tänään':'💊 Merkitse lääke otetuksi'}
            </button>
            <div class="new-medicine"><h3>🆕 Aloita uusi lääkepakkaus</h3>
                <input type="date" id="newStartDate" value="${today}">
                <button class="btn-secondary" onclick="startNewMedicine(document.getElementById('newStartDate').value)">Aloita uusi pakkaus</button>
            </div>
            <div class="history-section">
                <button class="toggle-history" onclick="toggleHistory()">📅 Näytä/piilota päivähistoria</button>
                <div class="history-list" id="historyList">${generateDayHistory()}</div>
            </div>`;
    }
    html+=`<div class="data-buttons">
        <button class="btn-secondary" onclick="exportData()">📤 Vie tiedot</button>
        <button class="btn-secondary" onclick="importData()">📥 Tuo tiedot</button>
    </div>`;
    document.getElementById('app').innerHTML=html;
}
</script>
</body>
</html>

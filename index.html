<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lääkevahti</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="theme-color" content="#0B6E8C">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; background:linear-gradient(135deg,#0B6E8C 0%,#1AC0B8 100%); min-height:100vh; padding:20px; }
        .container { max-width:520px; margin:0 auto; background:white; border-radius:20px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        h1 { color:#0B6E8C; text-align:center; margin-bottom:25px; font-size:28px; }
        button { width:100%; padding:15px; border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer; transition:all 0.3s; margin-bottom:10px; }
        .btn-primary { background:linear-gradient(135deg,#0B6E8C 0%,#1AC0B8 100%); color:white; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 5px 15px rgba(11,110,140,0.4); }
        .btn-success { background:#28a745; color:white; }
        .btn-success:hover { background:#218838; }
        .btn-secondary { background:#6c757d; color:white; font-size:14px; }
        .btn-secondary:hover { background:#5a6268; }
        .btn-danger { background:#dc3545; color:white; }
        .btn-danger:hover { background:#c82333; }

        #saveStatus { position:fixed; top:0; left:0; right:0; padding:8px; text-align:center; font-size:13px; font-weight:700; z-index:9998; transition:opacity 0.5s; opacity:0; }

        /* Kirjautumisruutu */
        #loginScreen { position:fixed; inset:0; background:linear-gradient(135deg,#0B6E8C 0%,#1AC0B8 100%); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
        .login-box { background:white; border-radius:20px; padding:36px 28px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        .login-title { font-size:26px; font-weight:800; color:#0B6E8C; text-align:center; margin-bottom:6px; }
        .login-sub { font-size:14px; color:#888; text-align:center; margin-bottom:24px; }
        .login-box label { display:block; font-size:13px; font-weight:700; color:#444; margin-bottom:5px; }
        .login-box input[type="email"], .login-box input[type="password"] { width:100%; padding:12px 14px; border:2px solid #ddd; border-radius:10px; font-size:16px; margin-bottom:14px; transition:border 0.2s; outline:none; }
        .login-box input:focus { border-color:#0B6E8C; }
        .login-btn { width:100%; padding:14px; background:linear-gradient(135deg,#0B6E8C 0%,#1AC0B8 100%); color:white; border:none; border-radius:10px; font-size:17px; font-weight:700; cursor:pointer; transition:opacity 0.2s; margin-bottom:0; }
        .login-btn:hover { opacity:0.9; }
        .login-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .login-error { color:#dc3545; font-size:13px; font-weight:700; text-align:center; margin-top:12px; min-height:20px; }

        /* Käyttäjäpalkki */
        .user-bar { display:flex; justify-content:space-between; align-items:center; background:#f0f4ff; border-radius:10px; padding:10px 14px; margin-bottom:20px; font-size:13px; color:#555; }
        .user-bar span { font-weight:600; color:#0B6E8C; font-size:12px; }
        .logout-btn { background:none; border:none; color:#dc3545; font-size:13px; font-weight:700; cursor:pointer; width:auto; padding:4px 8px; margin:0; }
        .logout-btn:hover { text-decoration:underline; }

        /* Lääkekortit */
        .med-list { margin-top:6px; }
        .med-card { background:#f8f9fa; border:2px solid #ddd; border-radius:14px; padding:20px; margin-bottom:16px; }
        .med-card.hero { background:linear-gradient(135deg,#0B6E8C 0%,#1AC0B8 100%); color:white; border:none; box-shadow:0 8px 20px rgba(11,110,140,0.3); }
        .med-card.warning-package:not(.hero) { border-color:#ffc107; background:#fffaf0; }
        .med-card.critical-package:not(.hero) { border-color:#dc3545; background:#fdf2f3; }
        .med-header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; }
        .med-header h3 { font-size:19px; color:#0B6E8C; }
        .med-card.hero .med-header h3 { color:white; }
        .med-actions { display:flex; gap:6px; flex-shrink:0; }
        .icon-btn { width:auto; padding:7px 10px; font-size:13px; margin:0; border-radius:8px; background:rgba(0,0,0,0.06); color:#333; }
        .med-card.hero .icon-btn { background:rgba(255,255,255,0.22); color:white; }
        .icon-btn:hover { opacity:0.8; }
        .med-days-number { font-size:44px; font-weight:800; line-height:1; margin:8px 0 2px; }
        .med-days-label { font-size:13px; opacity:0.85; }
        .med-card.hero .med-days-label { opacity:0.9; }
        .med-info-row { font-size:14px; color:#555; margin:4px 0; }
        .med-card.hero .med-info-row { color:rgba(255,255,255,0.92); }
        .badge { display:inline-block; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:700; margin:6px 6px 0 0; }
        .badge-package-warning { background:#fff3cd; color:#856404; }
        .badge-package-critical { background:#f8d7da; color:#721c24; }
        .badge-rx-warning { background:#ffe8cc; color:#8a4b00; }
        .badge-rx-critical { background:#f8d7da; color:#721c24; }
        .med-card.hero .badge { background:rgba(255,255,255,0.9); }
        .med-buttons { margin-top:14px; }
        .med-buttons button { margin-bottom:8px; }

        .form-card { background:#fff3cd; border:2px solid #ffc107; border-radius:12px; padding:20px; margin-bottom:18px; }
        .form-card h3 { color:#856404; margin-bottom:14px; font-size:16px; }
        .form-card label { display:block; font-size:13px; font-weight:700; color:#555; margin:10px 0 4px; }
        .form-card label:first-of-type { margin-top:0; }
        .form-card input { width:100%; padding:12px; border:2px solid #ddd; border-radius:8px; font-size:16px; }
        .form-card .form-error { color:#dc3545; font-size:13px; font-weight:700; margin-top:8px; min-height:18px; }
        .form-buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
        .form-buttons button { margin-bottom:0; }
        .hint { font-size:12px; color:#888; margin-top:-2px; margin-bottom:6px; }

        .empty-state { text-align:center; color:#999; padding:35px 10px; }
        .info-banner { background:#eaf6ff; border:2px solid #0B6E8C; color:#0B6E8C; border-radius:10px; padding:14px; margin-bottom:18px; font-size:13px; font-weight:600; }

        /* Lääketyypin valinta lomakkeessa */
        .mode-toggle { display:flex; gap:8px; margin-bottom:14px; }
        .mode-toggle button { flex:1; padding:10px 6px; border-radius:8px; border:2px solid #ddd; background:white; color:#555; font-size:13px; font-weight:700; margin:0; cursor:pointer; }
        .mode-toggle button.active { background:#0B6E8C; color:white; border-color:#0B6E8C; }

        /* Osiot (päivittäiset / tarvittaessa) */
        .section-title { font-size:13px; color:#888; text-transform:uppercase; letter-spacing:0.5px; margin:20px 0 10px; font-weight:800; }
        .asneeded-card { border-left:6px solid #1AC0B8; }

        .badge-neutral { background:#e7f3ff; color:#0B6E8C; }

        /* Reseptilistaus-sivu */
        .rx-list { margin-top:4px; }
        .rx-card { background:#f8f9fa; border:2px solid #ddd; border-radius:14px; padding:18px 20px; margin-bottom:14px; }
        .rx-card.rx-warning { border-color:#ffc107; background:#fffaf0; }
        .rx-card.rx-critical { border-color:#dc3545; background:#fdf2f3; }
        .rx-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
        .rx-card-top h3 { font-size:20px; color:#0B6E8C; }
        .rx-days-chip { flex-shrink:0; text-align:center; background:#0B6E8C; color:white; border-radius:12px; padding:8px 16px; min-width:56px; }
        .rx-days-chip .num { font-size:26px; font-weight:800; line-height:1; display:block; }
        .rx-days-chip .unit { font-size:10px; opacity:0.9; text-transform:uppercase; letter-spacing:0.5px; }
        .rx-days-chip.warning { background:#ffc107; color:#5c4400; }
        .rx-days-chip.critical { background:#dc3545; color:white; }
        .rx-card-date { font-size:15px; color:#444; font-weight:600; margin-top:10px; }
        .rx-card .badge { margin-top:10px; }

        /* Uusi pakkaus -lomake */
        .pkg-form-card { background:white; border:2px solid #e2e2e2; border-radius:18px; overflow:hidden; margin-bottom:16px; box-shadow:0 6px 18px rgba(11,110,140,0.12); }
        .pkg-form-header { background:linear-gradient(135deg,#0B6E8C 0%,#1AC0B8 100%); color:white; padding:20px 22px; }
        .pkg-form-tag { display:inline-block; background:rgba(255,255,255,0.25); padding:4px 12px; border-radius:20px; font-size:11px; font-weight:800; letter-spacing:0.6px; margin-bottom:8px; }
        .pkg-form-header h3 { font-size:22px; font-weight:800; }
        .pkg-form-body { padding:22px; }
        .pkg-form-body label { display:block; font-size:13px; font-weight:700; color:#555; margin:16px 0 6px; }
        .pkg-form-body label:first-of-type { margin-top:0; }
        .pkg-form-body input { width:100%; padding:14px; border:2px solid #ddd; border-radius:10px; font-size:17px; }
        .pkg-form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .pkg-form-section { background:#f0f8fb; border-radius:14px; padding:16px 18px; margin-top:20px; }
        .pkg-form-section-title { font-size:12px; font-weight:800; color:#0B6E8C; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:2px; }
        .pkg-form-body .form-error { color:#dc3545; font-size:13px; font-weight:700; margin-top:10px; min-height:18px; }
    </style>
</head>
<body>

<!-- Kirjautumisruutu -->
<div id="loginScreen">
    <div class="login-box">
        <div class="login-title">💊 Lääkevahti</div>
        <div class="login-sub">Kirjaudu sisään jatkaaksesi</div>

        <label for="emailInput">Sähköposti</label>
        <input type="email" id="emailInput" placeholder="sinun@email.fi" autocomplete="username">

        <label for="passwordInput">Salasana</label>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">Kirjaudu sisään</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<div id="saveStatus"></div>

<div class="container">
    <h1>💊 Lääkevahti</h1>
    <div class="user-bar" id="userBar" style="display:none;">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="handleLogout()">🚪 Kirjaudu ulos</button>
    </div>
    <div id="app"><p style="text-align:center;color:#999;">Ladataan...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDswdEF9J0gsHJH6Zo_8BGZrf8DVG3FwYc",
    authDomain: "hakemuspaivakirja.firebaseapp.com",
    projectId: "hakemuspaivakirja",
    storageBucket: "hakemuspaivakirja.firebasestorage.app",
    messagingSenderId: "836133210317",
    appId: "1:836133210317:web:d85131ae272ecf1938c184"
};

const app      = initializeApp(firebaseConfig);
const db       = getFirestore(app);
const auth     = getAuth(app);
const DATA_DOC = doc(db, "astmalaake", "data");

// ============================
// ASETUKSET (hälytysrajat)
// ============================
const PACKAGE_WARNING_DAYS  = 10; // pakkaus "loppumassa" -varoitus
const PACKAGE_CRITICAL_DAYS = 3;  // pakkaus "loppuu heti" -varoitus
const RX_WARNING_DAYS       = 30; // resepti "vanhenemassa" -varoitus
const RX_CRITICAL_DAYS      = 7;  // resepti "vanhenee heti" -varoitus

// ============================
// TILA
// ============================
let data = { medicines: {} };
let legacyDataDetected = false;
let isSaving = false;
let unsubSnapshot = null;

// UI-tila (ei tallenneta Firebaseen)
let ui = { view:'dashboard', addFormOpen:false, addFormMode:'daily', editId:null, editFormMode:null, newPackageId:null };

// ============================
// AUTH STATE
// ============================
onAuthStateChanged(auth, user => {
    if(user){
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('userEmail').textContent = user.email;
        loadFromFirebase();
    } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('userBar').style.display = 'none';
        document.getElementById('app').innerHTML = '<p style="text-align:center;color:#999;">Ladataan...</p>';
        if(unsubSnapshot){ unsubSnapshot(); unsubSnapshot = null; }
    }
});

// ============================
// KIRJAUTUMINEN
// ============================
window.handleLogin = async () => {
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn      = document.getElementById('loginBtn');
    const err      = document.getElementById('loginError');

    if(!email || !password){ err.textContent = "Syötä sähköposti ja salasana."; return; }

    btn.disabled = true;
    btn.textContent = "Kirjaudutaan...";
    err.textContent = "";

    try {
        await signInWithEmailAndPassword(auth, email, password);
    } catch(e){
        btn.disabled = false;
        btn.textContent = "Kirjaudu sisään";
        if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'){
            err.textContent = "Väärä sähköposti tai salasana.";
        } else if(e.code === 'auth/too-many-requests'){
            err.textContent = "Liian monta yritystä. Yritä myöhemmin.";
        } else {
            err.textContent = "Kirjautuminen epäonnistui. (" + e.code + ")";
        }
    }
};

document.getElementById('passwordInput').addEventListener('keydown', e => { if(e.key==='Enter') window.handleLogin(); });
document.getElementById('emailInput').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('passwordInput').focus(); });

// ============================
// ULOSKIRJAUTUMINEN
// ============================
window.handleLogout = async () => {
    if(confirm('Haluatko kirjautua ulos?')) await signOut(auth);
};

// ============================
// TALLENNUSINDIKAATTORI
// ============================
function showSaveStatus(msg, color){
    const el = document.getElementById('saveStatus');
    el.textContent = msg;
    el.style.background = color || '#0B6E8C';
    el.style.color = 'white';
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 2000);
}

// ============================
// FIREBASE TALLENNUS / LATAUS
// ============================
async function saveData(){
    if(isSaving) return;
    isSaving = true;
    showSaveStatus('💾 Tallennetaan...', '#f97316');
    try {
        localStorage.setItem('laakevahti_bkp', JSON.stringify(data));
        await setDoc(DATA_DOC, { json: JSON.stringify(data) });
        showSaveStatus('✅ Tallennettu', '#22c55e');
    } catch(e){
        showSaveStatus('❌ Tallennus epäonnistui', '#dc2626');
        console.error(e);
    }
    isSaving = false;
}

function normalizeLoadedData(parsed){
    if(parsed && parsed.medicines && typeof parsed.medicines === 'object'){
        // varmista että jokaisella lääkkeellä on kaikki uudet kentät (taaksepäin yhteensopivuus)
        Object.values(parsed.medicines).forEach(m => {
            if(!m.mode) m.mode = 'daily';
            if(typeof m.prescriptionTotalPackages === 'undefined') m.prescriptionTotalPackages = null;
            if(typeof m.prescriptionPackagesUsed === 'undefined') m.prescriptionPackagesUsed = 0;
        });
        return parsed;
    }
    // Vanha tietomalli (yksi lääke: startDate/doses) - ei voida automaattisesti muuntaa,
    // koska pakkauskoko/annostus eivät olleet aiemmin tiedossa.
    legacyDataDetected = true;
    return { medicines: {} };
}

async function loadFromFirebase(){
    try {
        const snap = await getDoc(DATA_DOC);
        if(snap.exists()){
            data = normalizeLoadedData(JSON.parse(snap.data().json));
        } else {
            const bkp = localStorage.getItem('laakevahti_bkp');
            if(bkp){
                try { data = normalizeLoadedData(JSON.parse(bkp)); await saveData(); }
                catch(e){ data = { medicines:{} }; }
            }
        }
    } catch(e){
        const bkp = localStorage.getItem('laakevahti_bkp');
        if(bkp) try { data = normalizeLoadedData(JSON.parse(bkp)); } catch(e2){}
        showSaveStatus('⚠️ Yhteysvirhe – paikallinen data', '#f59e0b');
    }
    render();
    if(unsubSnapshot) unsubSnapshot();
    unsubSnapshot = onSnapshot(DATA_DOC, snap => {
        if(!snap.exists() || isSaving) return;
        try { data = normalizeLoadedData(JSON.parse(snap.data().json)); render(); } catch(e){}
    });
}

// ============================
// APUFUNKTIOT (päivämäärät)
// ============================
function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function getTodayString(){ return new Date().toISOString().split('T')[0]; }
function formatDate(dateStr){ if(!dateStr) return '-'; return new Date(dateStr+'T12:00:00').toLocaleDateString('fi-FI'); }
function addDaysToDate(dateStr, days){ const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+days); return d.toISOString().split('T')[0]; }
function daysFromToday(dateStr){
    const end = new Date(dateStr+'T12:00:00');
    const today = new Date(); today.setHours(12,0,0,0);
    return Math.ceil((end-today)/(1000*60*60*24));
}

// Pakkauksen loppumispäivä = aloituspäivä + floor(pakkauskoko / annos per päivä) päivää
function getPackageEndDate(m){
    const totalDays = Math.floor(m.packageSize / m.dosePerDay);
    return addDaysToDate(m.startDate, totalDays);
}
function getPackageDaysRemaining(m){ return daysFromToday(getPackageEndDate(m)); }
function getPrescriptionDaysRemaining(m){ return m.prescriptionValidUntil ? daysFromToday(m.prescriptionValidUntil) : null; }
function getPrescriptionPackagesRemaining(m){
    if(!m.prescriptionTotalPackages) return null;
    const used = m.prescriptionPackagesUsed || 0;
    return Math.max(0, m.prescriptionTotalPackages - used);
}

// ============================
// LÄÄKKEEN LISÄYS
// ============================
window.showAddMedicineForm = () => { ui.addFormOpen = true; ui.addFormMode = 'daily'; ui.editId = null; ui.newPackageId = null; render(); };
window.cancelAddMedicine = () => { ui.addFormOpen = false; render(); };
window.setAddFormMode = (mode) => { ui.addFormMode = mode; render(); };

window.saveNewMedicine = async () => {
    const mode = ui.addFormMode || 'daily';
    const name  = document.getElementById('newMedName').value.trim();
    const rx    = document.getElementById('newMedRx').value;
    const totalRaw = document.getElementById('newMedTotal').value;
    const usedRaw  = document.getElementById('newMedUsed').value;
    const err   = document.getElementById('newMedError');

    if(!name){ err.textContent = 'Anna lääkkeen nimi.'; return; }

    const total = totalRaw ? parseInt(totalRaw, 10) : null;
    const used  = usedRaw !== '' ? parseInt(usedRaw, 10) : (total ? 1 : 0);

    const med = {
        name, mode,
        prescriptionValidUntil: rx || null,
        prescriptionTotalPackages: total,
        prescriptionPackagesUsed: used
    };

    if(mode === 'daily'){
        const size  = parseFloat(document.getElementById('newMedSize').value);
        const dose  = parseFloat(document.getElementById('newMedDose').value);
        const start = document.getElementById('newMedStart').value || getTodayString();
        if(!size || size <= 0){ err.textContent = 'Anna pakkauksen pillerimäärä (yli 0).'; return; }
        if(!dose || dose <= 0){ err.textContent = 'Anna annos päivässä (yli 0).'; return; }
        med.packageSize = size; med.dosePerDay = dose; med.startDate = start;
    } else {
        med.packageSize = null; med.dosePerDay = null; med.startDate = null;
    }

    const id = uid();
    data.medicines[id] = med;
    ui.addFormOpen = false;
    await saveData(); render();
};

// ============================
// LÄÄKKEEN MUOKKAUS
// ============================
window.openEditMedicine = (id) => { ui.editId = id; ui.editFormMode = (data.medicines[id] && data.medicines[id].mode) || 'daily'; ui.addFormOpen = false; ui.newPackageId = null; render(); };
window.cancelEditMedicine = () => { ui.editId = null; ui.editFormMode = null; render(); };
window.setEditFormMode = (mode) => { ui.editFormMode = mode; render(); };

window.saveEditMedicine = async (id) => {
    const m = data.medicines[id]; if(!m) return;
    const mode  = ui.editFormMode || m.mode || 'daily';
    const name  = document.getElementById('editName_'+id).value.trim();
    const rx    = document.getElementById('editRx_'+id).value;
    const totalRaw = document.getElementById('editTotal_'+id).value;
    const usedRaw  = document.getElementById('editUsed_'+id).value;
    const err   = document.getElementById('editError_'+id);

    if(!name){ err.textContent = 'Anna lääkkeen nimi.'; return; }

    const total = totalRaw ? parseInt(totalRaw, 10) : null;
    const used  = usedRaw !== '' ? parseInt(usedRaw, 10) : 0;

    if(mode === 'daily'){
        const size  = parseFloat(document.getElementById('editSize_'+id).value);
        const dose  = parseFloat(document.getElementById('editDose_'+id).value);
        const start = document.getElementById('editStart_'+id).value;
        if(!size || size <= 0){ err.textContent = 'Anna pakkauksen pillerimäärä (yli 0).'; return; }
        if(!dose || dose <= 0){ err.textContent = 'Anna annos päivässä (yli 0).'; return; }
        if(!start){ err.textContent = 'Anna pakkauksen aloituspäivä.'; return; }
        m.packageSize = size; m.dosePerDay = dose; m.startDate = start;
    } else {
        m.packageSize = null; m.dosePerDay = null; m.startDate = null;
    }

    m.name = name; m.mode = mode; m.prescriptionValidUntil = rx || null;
    m.prescriptionTotalPackages = total; m.prescriptionPackagesUsed = used;

    ui.editId = null; ui.editFormMode = null;
    await saveData(); render();
};

window.deleteMedicine = async (id) => {
    const m = data.medicines[id];
    if(!confirm('Haluatko varmasti poistaa lääkkeen "' + (m ? m.name : '') + '"? Tätä ei voi perua.')) return;
    delete data.medicines[id];
    await saveData(); render();
};

// ============================
// UUSI PAKKAUS (päivittäin käytettävät)
// ============================
window.openNewPackage = (id) => { ui.newPackageId = id; ui.addFormOpen = false; ui.editId = null; render(); };
window.cancelNewPackage = () => { ui.newPackageId = null; render(); };

window.saveNewPackage = async (id) => {
    const m = data.medicines[id]; if(!m) return;
    const size  = parseFloat(document.getElementById('pkgSize_'+id).value);
    const dose  = parseFloat(document.getElementById('pkgDose_'+id).value);
    const start = document.getElementById('pkgStart_'+id).value || getTodayString();
    const rx    = document.getElementById('pkgRx_'+id).value;
    const totalRaw = document.getElementById('pkgTotal_'+id).value;
    const err   = document.getElementById('pkgError_'+id);

    if(!size || size <= 0){ err.textContent = 'Anna pakkauksen pillerimäärä (yli 0).'; return; }
    if(!dose || dose <= 0){ err.textContent = 'Anna annos päivässä (yli 0).'; return; }

    const newTotal = totalRaw ? parseInt(totalRaw, 10) : m.prescriptionTotalPackages;
    const sameRx = (rx || null) === (m.prescriptionValidUntil || null);

    if(sameRx && m.prescriptionValidUntil){
        // Jatketaan samalla reseptillä -> pakkauslaskuri kasvaa automaattisesti
        m.prescriptionTotalPackages = newTotal;
        m.prescriptionPackagesUsed = (m.prescriptionPackagesUsed || 0) + 1;
    } else {
        // Resepti vaihtui/uusittiin -> laskuri alkaa alusta tällä pakkauksella
        m.prescriptionValidUntil = rx || null;
        m.prescriptionTotalPackages = newTotal;
        m.prescriptionPackagesUsed = newTotal ? 1 : 0;
    }

    m.startDate = start; m.packageSize = size; m.dosePerDay = dose;

    ui.newPackageId = null;
    await saveData(); render();
};

// ============================
// TARVITTAESSA KÄYTETTÄVÄT: PAKKAUKSEN OSTON MERKINTÄ
// ============================
window.logAsNeededPackage = async (id) => {
    const m = data.medicines[id]; if(!m) return;
    if(!confirm('Merkitäänkö uusi pakkaus ostetuksi lääkkeelle "' + m.name + '"?')) return;
    m.prescriptionPackagesUsed = (m.prescriptionPackagesUsed || 0) + 1;
    await saveData(); render();
};

// ============================
// NÄKYMÄN VAIHTO (kojelauta / reseptilistaus)
// ============================
window.showPrescriptionsView = () => { ui.view = 'prescriptions'; render(); };
window.showDashboard = () => { ui.view = 'dashboard'; render(); };

// ============================
// RENDER-APURIT
// ============================
function packageBadge(days){
    if(days <= PACKAGE_CRITICAL_DAYS) return `<span class="badge badge-package-critical">🔴 Pakkaus ${days<=0?'on loppunut':'loppuu '+days+' pv kuluttua'}</span>`;
    if(days <= PACKAGE_WARNING_DAYS)  return `<span class="badge badge-package-warning">🟡 Pakkaus loppumassa (${days} pv)</span>`;
    return '';
}
function rxBadge(days){
    if(days === null) return '';
    if(days <= RX_CRITICAL_DAYS) return `<span class="badge badge-rx-critical">🔴 Resepti ${days<=0?'on vanhentunut':'vanhenee '+days+' pv kuluttua'}</span>`;
    if(days <= RX_WARNING_DAYS)  return `<span class="badge badge-rx-warning">🟡 Resepti vanhenemassa (${days} pv)</span>`;
    return '';
}
function refillBadge(m){
    if(!m.prescriptionTotalPackages) return '';
    const remaining = getPrescriptionPackagesRemaining(m);
    if(remaining <= 0) return `<span class="badge badge-rx-critical">🔴 Resepti käytetty loppuun (${m.prescriptionPackagesUsed}/${m.prescriptionTotalPackages})</span>`;
    if(remaining === 1) return `<span class="badge badge-rx-warning">🟡 Reseptillä 1 pakkaus jäljellä (${m.prescriptionPackagesUsed}/${m.prescriptionTotalPackages})</span>`;
    return `<span class="badge badge-neutral">🧾 Reseptillä jäljellä ${remaining} pakkausta (${m.prescriptionPackagesUsed}/${m.prescriptionTotalPackages})</span>`;
}

function renderAddForm(){
    const today = getTodayString();
    const mode = ui.addFormMode || 'daily';
    const dailyFields = mode === 'daily' ? `
        <label for="newMedSize">Pillereitä pakkauksessa</label>
        <input type="number" id="newMedSize" min="1" step="1" placeholder="esim. 60">

        <label for="newMedDose">Annos päivässä</label>
        <input type="number" id="newMedDose" min="0.5" step="0.5" placeholder="esim. 2">
        <div class="hint">Sovellus laskee automaattisesti joka päivä yhden annoksen otetuksi.</div>

        <label for="newMedStart">Nykyisen pakkauksen aloituspäivä</label>
        <input type="date" id="newMedStart" value="${today}">` :
        `<div class="hint">Tarvittaessa käytettävälle lääkkeelle ei tarvita annostustietoja – seurataan vain reseptiä ja pakkausmäärää.</div>`;

    return `<div class="form-card">
        <h3>➕ Lisää uusi lääke</h3>

        <div class="mode-toggle">
            <button type="button" class="${mode==='daily'?'active':''}" onclick="setAddFormMode('daily')">💊 Päivittäin käytettävä</button>
            <button type="button" class="${mode==='asNeeded'?'active':''}" onclick="setAddFormMode('asNeeded')">🕐 Tarvittaessa / resepti</button>
        </div>

        <label for="newMedName">Lääkkeen nimi</label>
        <input type="text" id="newMedName" placeholder="esim. Symbicort">

        <label for="newMedRx">Resepti voimassa asti (valinnainen)</label>
        <input type="date" id="newMedRx">

        <label for="newMedTotal">Pakkauksia reseptillä yhteensä (valinnainen, esim. 3)</label>
        <input type="number" id="newMedTotal" min="1" step="1" placeholder="esim. 3">

        <label for="newMedUsed">Joista jo käytetty/ostettu</label>
        <input type="number" id="newMedUsed" min="0" step="1" value="1">
        <div class="hint">Jos lisäät lääkkeen, jota jo käytät, tämä on yleensä 1.</div>

        ${dailyFields}

        <div class="form-error" id="newMedError"></div>
        <div class="form-buttons">
            <button class="btn-secondary" onclick="cancelAddMedicine()">Peruuta</button>
            <button class="btn-primary" onclick="saveNewMedicine()">Tallenna</button>
        </div>
    </div>`;
}

function renderEditForm(m){
    const mode = ui.editFormMode || m.mode || 'daily';
    const dailyFields = mode === 'daily' ? `
        <label for="editSize_${m.id}">Pillereitä pakkauksessa</label>
        <input type="number" id="editSize_${m.id}" min="1" step="1" value="${m.packageSize||''}">

        <label for="editDose_${m.id}">Annos päivässä</label>
        <input type="number" id="editDose_${m.id}" min="0.5" step="0.5" value="${m.dosePerDay||''}">

        <label for="editStart_${m.id}">Nykyisen pakkauksen aloituspäivä</label>
        <input type="date" id="editStart_${m.id}" value="${m.startDate||getTodayString()}">` :
        `<div class="hint">Tarvittaessa käytettävälle lääkkeelle ei tarvita annostustietoja.</div>`;

    return `<div class="med-card">
        <h3 style="color:#0B6E8C;margin-bottom:14px;">✏️ Muokkaa: ${m.name}</h3>

        <div class="mode-toggle">
            <button type="button" class="${mode==='daily'?'active':''}" onclick="setEditFormMode('daily')">💊 Päivittäin käytettävä</button>
            <button type="button" class="${mode==='asNeeded'?'active':''}" onclick="setEditFormMode('asNeeded')">🕐 Tarvittaessa / resepti</button>
        </div>

        <label for="editName_${m.id}">Lääkkeen nimi</label>
        <input type="text" id="editName_${m.id}" value="${m.name}">

        <label for="editRx_${m.id}">Resepti voimassa asti</label>
        <input type="date" id="editRx_${m.id}" value="${m.prescriptionValidUntil||''}">

        <label for="editTotal_${m.id}">Pakkauksia reseptillä yhteensä</label>
        <input type="number" id="editTotal_${m.id}" min="1" step="1" value="${m.prescriptionTotalPackages||''}">

        <label for="editUsed_${m.id}">Joista käytetty/ostettu</label>
        <input type="number" id="editUsed_${m.id}" min="0" step="1" value="${m.prescriptionPackagesUsed||0}">

        ${dailyFields}

        <div class="form-error" id="editError_${m.id}"></div>
        <div class="form-buttons">
            <button class="btn-secondary" onclick="cancelEditMedicine()">Peruuta</button>
            <button class="btn-primary" onclick="saveEditMedicine('${m.id}')">Tallenna</button>
        </div>
    </div>`;
}

function renderNewPackageForm(m){
    const today = getTodayString();
    return `<div class="pkg-form-card">
        <div class="pkg-form-header">
            <span class="pkg-form-tag">🆕 UUSI PAKKAUS</span>
            <h3>${m.name}</h3>
        </div>
        <div class="pkg-form-body">
            <div class="hint" style="margin-bottom:4px;">Edellinen pakkaus siirtyy historiaan.</div>

            <div class="pkg-form-row">
                <div>
                    <label for="pkgSize_${m.id}">Pillereitä pakkauksessa</label>
                    <input type="number" id="pkgSize_${m.id}" min="1" step="1" value="${m.packageSize}">
                </div>
                <div>
                    <label for="pkgDose_${m.id}">Annos päivässä</label>
                    <input type="number" id="pkgDose_${m.id}" min="0.5" step="0.5" value="${m.dosePerDay}">
                </div>
            </div>

            <label for="pkgStart_${m.id}">Aloituspäivä</label>
            <input type="date" id="pkgStart_${m.id}" value="${today}">

            <div class="pkg-form-section">
                <div class="pkg-form-section-title">📝 Resepti</div>
                <label for="pkgRx_${m.id}">Voimassa asti</label>
                <input type="date" id="pkgRx_${m.id}" value="${m.prescriptionValidUntil||''}">
                <div class="hint">Jätä sama päivä jos jatkat samalla reseptillä – pakkauslaskuri päivittyy automaattisesti. Vaihda päivä jos resepti uusittiin.</div>

                <label for="pkgTotal_${m.id}">Pakkauksia reseptillä yhteensä</label>
                <input type="number" id="pkgTotal_${m.id}" min="1" step="1" value="${m.prescriptionTotalPackages||''}">
            </div>

            <div class="form-error" id="pkgError_${m.id}"></div>
            <div class="form-buttons">
                <button class="btn-secondary" onclick="cancelNewPackage()">Peruuta</button>
                <button class="btn-primary" onclick="saveNewPackage('${m.id}')">Tallenna</button>
            </div>
        </div>
    </div>`;
}

function renderMedCard(m, isHero){
    if(ui.editId === m.id) return renderEditForm(m);
    if(ui.newPackageId === m.id) return renderNewPackageForm(m);

    const packageDays = getPackageDaysRemaining(m);
    const packageEnd  = getPackageEndDate(m);
    const rxDays      = getPrescriptionDaysRemaining(m);

    let cls = 'med-card';
    if(isHero) cls += ' hero';
    if(packageDays <= PACKAGE_CRITICAL_DAYS) cls += ' critical-package';
    else if(packageDays <= PACKAGE_WARNING_DAYS) cls += ' warning-package';

    return `<div class="${cls}">
        <div class="med-header">
            <h3>${m.name}</h3>
            <div class="med-actions">
                <button class="icon-btn" onclick="openEditMedicine('${m.id}')">✏️</button>
                <button class="icon-btn" onclick="deleteMedicine('${m.id}')">🗑️</button>
            </div>
        </div>

        <div class="med-days-number">${packageDays}</div>
        <div class="med-days-label">päivää lääkettä jäljellä (loppuu noin ${formatDate(packageEnd)})</div>

        ${packageBadge(packageDays)}${rxBadge(rxDays)}${refillBadge(m)}

        <div class="med-info-row" style="margin-top:10px;">📦 ${m.packageSize} pilleriä pakkauksessa · ${m.dosePerDay} pilleriä/pv</div>
        <div class="med-info-row">📅 Pakkaus aloitettu ${formatDate(m.startDate)}</div>
        ${m.prescriptionValidUntil ? `<div class="med-info-row">📝 Resepti voimassa ${formatDate(m.prescriptionValidUntil)} asti</div>` : `<div class="med-info-row">📝 Reseptin voimassaoloa ei asetettu</div>`}

        <div class="med-buttons">
            <button class="btn-success" onclick="openNewPackage('${m.id}')">🆕 Aloita uusi pakkaus</button>
        </div>
    </div>`;
}

function renderAsNeededCard(m){
    if(ui.editId === m.id) return renderEditForm(m);

    const rxDays = getPrescriptionDaysRemaining(m);
    const remaining = getPrescriptionPackagesRemaining(m);

    let cls = 'med-card asneeded-card';
    if(rxDays !== null && rxDays <= RX_CRITICAL_DAYS) cls += ' critical-package';
    else if(rxDays !== null && rxDays <= RX_WARNING_DAYS) cls += ' warning-package';

    return `<div class="${cls}">
        <div class="med-header">
            <h3>${m.name}</h3>
            <div class="med-actions">
                <button class="icon-btn" onclick="openEditMedicine('${m.id}')">✏️</button>
                <button class="icon-btn" onclick="deleteMedicine('${m.id}')">🗑️</button>
            </div>
        </div>

        ${m.prescriptionValidUntil ? `<div class="med-info-row">📝 Resepti voimassa ${formatDate(m.prescriptionValidUntil)} asti${rxDays!==null ? ' ('+rxDays+' pv)' : ''}</div>` : `<div class="med-info-row">📝 Reseptin voimassaoloa ei asetettu</div>`}

        ${rxBadge(rxDays)}${refillBadge(m)}

        ${m.prescriptionTotalPackages ? `<div class="med-buttons"><button class="btn-secondary" onclick="logAsNeededPackage('${m.id}')">🛒 Merkitse pakkaus ostetuksi (${remaining} jäljellä)</button></div>` : ''}
    </div>`;
}

// ============================
// RESEPTILISTAUS-NÄKYMÄ
// ============================
function renderPrescriptionsView(){
    const meds = Object.values(data.medicines).filter(m => m.prescriptionValidUntil);
    meds.sort((a,b) => new Date(a.prescriptionValidUntil) - new Date(b.prescriptionValidUntil));

    let html = `<button class="btn-secondary" onclick="showDashboard()">← Takaisin</button>`;
    html += `<h2 class="section-title" style="margin-top:18px;">📋 Reseptien voimassaolo</h2>`;

    if(meds.length === 0){
        html += `<div class="empty-state">Ei lääkkeitä, joilla on reseptin voimassaolopäivä asetettuna.</div>`;
    } else {
        html += `<div class="rx-list">`;
        meds.forEach(m => {
            const days = getPrescriptionDaysRemaining(m);
            let cardCls = 'rx-card';
            let chipCls = 'rx-days-chip';
            if(days <= RX_CRITICAL_DAYS){ cardCls += ' rx-critical'; chipCls += ' critical'; }
            else if(days <= RX_WARNING_DAYS){ cardCls += ' rx-warning'; chipCls += ' warning'; }

            const chipContent = days <= 0
                ? `<span class="num">⚠️</span><span class="unit">vanhentunut</span>`
                : `<span class="num">${days}</span><span class="unit">pv</span>`;

            html += `<div class="${cardCls}">
                <div class="rx-card-top">
                    <h3>${m.name}</h3>
                    <div class="${chipCls}">${chipContent}</div>
                </div>
                <div class="rx-card-date">📅 Resepti vanhenee ${formatDate(m.prescriptionValidUntil)}</div>
                ${refillBadge(m)}
            </div>`;
        });
        html += `</div>`;
    }

    document.getElementById('app').innerHTML = html;
}

// ============================
// RENDER
// ============================
function render(){
    if(ui.view === 'prescriptions'){ renderPrescriptionsView(); return; }

    const allMeds = Object.entries(data.medicines).map(([id,m]) => ({ id, ...m }));
    const dailyMeds = allMeds.filter(m => (m.mode || 'daily') === 'daily');
    const asNeededMeds = allMeds.filter(m => m.mode === 'asNeeded');

    dailyMeds.sort((a,b) => getPackageDaysRemaining(a) - getPackageDaysRemaining(b));
    asNeededMeds.sort((a,b) => {
        const da = getPrescriptionDaysRemaining(a), db = getPrescriptionDaysRemaining(b);
        if(da === null && db === null) return a.name.localeCompare(b.name);
        if(da === null) return 1;
        if(db === null) return -1;
        return da - db;
    });

    let html = '';

    if(legacyDataDetected && allMeds.length === 0){
        html += `<div class="info-banner">ℹ️ Sovellus päivitettiin tukemaan useita lääkkeitä. Aiempaa yhden lääkkeen dataa ei voitu muuntaa automaattisesti (pakkauskoko ei ollut tiedossa) – lisää lääkkeesi uudelleen alta.</div>`;
    }

    if(ui.addFormOpen){
        html += renderAddForm();
    } else {
        html += `<button class="btn-primary" onclick="showAddMedicineForm()">➕ Lisää uusi lääke</button>`;
    }

    html += `<button class="btn-secondary" onclick="showPrescriptionsView()">📋 Reseptilistaus</button>`;

    if(allMeds.length === 0){
        html += `<div class="empty-state">Ei vielä lisättyjä lääkkeitä.<br>Lisää ensimmäinen lääke yllä olevasta napista.</div>`;
    } else {
        if(dailyMeds.length){
            html += `<h2 class="section-title">💊 Päivittäin käytettävät</h2><div class="med-list">`;
            dailyMeds.forEach((m, idx) => { html += renderMedCard(m, idx === 0 && !ui.addFormOpen); });
            html += `</div>`;
        }
        if(asNeededMeds.length){
            html += `<h2 class="section-title">🕐 Tarvittaessa käytettävät (reseptiseuranta)</h2><div class="med-list">`;
            asNeededMeds.forEach(m => { html += renderAsNeededCard(m); });
            html += `</div>`;
        }
    }

    document.getElementById('app').innerHTML = html;
}
</script>
</body>
</html>

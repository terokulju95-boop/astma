<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lääkevahti</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<meta name="theme-color" content="#0B6E8C" id="themeColorMeta">
<style>
/* ============================================================
   MUUTTUJAT
   Kaikki värit, pyöristykset, varjot ja mitat tulevat täältä.
   Teeman vaihto muuttaa vain näitä arvoja – yksikään komponentti
   ei tiedä mitään väreistä, joten uuden teeman lisääminen ei
   vaadi muutoksia muualle.

   --h on korostusvärin sävy (0-360). Sekä --brand että --brand-2
   johdetaan siitä, joten liukusäädin riittää värin vaihtamiseen.
   ============================================================ */
:root{
    --h:194;
    --brand:hsl(var(--h) 78% 30%);
    --brand-2:hsl(calc(var(--h) - 17) 76% 43%);
    --brand-soft:hsl(var(--h) 60% 96%);
    --brand-text:hsl(var(--h) 72% 27%);
    --on-brand:#fff;          /* JS laskee taustan kirkkauden mukaan */
    --on-brand-2:#fff;

    --bg:#EDF3F6;
    --surface:#fff;
    --surface-2:#F3F7F9;
    --text:#152730;
    --text-soft:#5A727E;
    --text-faint:#93A7B2;
    --border:#DCE6EB;
    --border-strong:#C4D3DA;

    --ok:#1E8E4A;
    --warn:#8A6100;
    --warn-bg:#FFF7E3;
    --warn-border:#EAC45A;
    --danger:#B3261E;
    --danger-bg:#FDF1F0;
    --danger-border:#E3A09B;

    --type-daily:#2563EB;      /* päivittäin käytettävä */
    --type-asneeded:#0F9E96;   /* tarvittaessa käytettävä */

    /* Nappien värit ovat omia muuttujiaan, jotta jokaisen voi
       vaihtaa asetuksista erikseen. Jokaisella on pari: tausta ja
       sen päälle tuleva teksti. Arvot ovat aina kirjoitettuja
       heksalukuja, koska asetusnäkymä lukee ne väriveistimeen. */
    --btn-success:#1E8E4A;  --on-success:#FFFFFF;
    --btn-rx:#FFF7E3;       --on-rx:#8A6100;  --btn-rx-border:#EAC45A;
    --btn-cart:#FF9830;     --on-cart:#1A1A1A;
    --btn-secondary:#FFFFFF; --on-secondary:#152730;

    /* Pyöristykset: vain kolme kokoa koko sovelluksessa */
    --r-btn:10px;
    --r-card:16px;
    --r-pill:999px;

    /* Varjot: vain kaksi tasoa */
    --sh-1:0 1px 2px rgba(16,32,40,.08);
    --sh-2:0 10px 28px rgba(16,32,40,.16);

    --bw:1.5px;                /* reunan paksuus */
    --fs:1;                    /* tekstikoko */
    --pad:1.25rem;             /* kortin sisäreunus */
    --gap:0.85rem;             /* korttien väli */
}

/* ---------- Teemat ---------- */
body[data-theme="metsa"]{
    --bg:#EFF4EE; --surface:#fff; --surface-2:#F4F8F3;
    --text:#1A2A20; --text-soft:#5B7264; --text-faint:#94A89A;
    --border:#DEE8DF; --border-strong:#C6D6C8;
    --brand-text:hsl(var(--h) 58% 25%);
    --brand-soft:hsl(var(--h) 45% 95%);
    --btn-secondary:#FFFFFF; --on-secondary:#1A2A20;
}
body[data-theme="hiekka"]{
    --bg:#F4EFE5; --surface:#FFFDF8; --surface-2:#F9F5EC;
    --text:#2B2318; --text-soft:#6E6151; --text-faint:#A3937D;
    --border:#E7DCC9; --border-strong:#D6C7AC;
    --brand-text:hsl(var(--h) 62% 28%);
    --brand-soft:hsl(var(--h) 55% 95%);
    --btn-success:#3F7D4E;
    --btn-cart:#D98A3A; --on-cart:#FFFFFF;
    --btn-secondary:#FFFDF8; --on-secondary:#2B2318;
}
body[data-theme="yo"]{
    --bg:#0F151A; --surface:#19222A; --surface-2:#212C35;
    --text:#E9EFF3; --text-soft:#9FB3BF; --text-faint:#75909E;
    --border:#2C3A45; --border-strong:#3C4D5A;
    --brand:hsl(var(--h) 62% 42%);
    --brand-2:hsl(calc(var(--h) - 17) 60% 50%);
    --brand-text:hsl(var(--h) 70% 64%);
    --brand-soft:hsl(var(--h) 35% 18%);
    --warn:#F2C14E; --warn-bg:#2A2415; --warn-border:#6B5A22;
    --danger:#FF9B91; --danger-bg:#2E1B1A; --danger-border:#7A3B37;
    --ok:#4ADE80;
    --type-daily:#60A5FA; --type-asneeded:#2DD4BF;
    /* Tummassa teemassa kirkkaat napit hohtavat, joten oletukset
       ovat vaimeampia kuin vaaleissa teemoissa. */
    --btn-success:#2F8F57;  --on-success:#FFFFFF;
    --btn-rx:#2A2415;       --on-rx:#F2C14E;  --btn-rx-border:#6B5A22;
    --btn-cart:#C2712A;     --on-cart:#FFFFFF;
    --btn-secondary:#212C35; --on-secondary:#E9EFF3;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 10px 28px rgba(0,0,0,.55);
}
body[data-theme="kontrasti"]{
    --bg:#000; --surface:#000; --surface-2:#0D0D0D;
    --text:#fff; --text-soft:#EDEDED; --text-faint:#C9C9C9;
    --border:#fff; --border-strong:#fff;
    --brand:hsl(var(--h) 85% 42%);
    --brand-2:hsl(calc(var(--h) - 17) 85% 48%);
    --brand-text:hsl(var(--h) 100% 74%);
    --brand-soft:#000;
    --warn:#FFD400; --warn-bg:#000; --warn-border:#FFD400;
    --danger:#FF6B6B; --danger-bg:#000; --danger-border:#FF6B6B;
    --ok:#4ADE80;
    --type-daily:#82B4FF; --type-asneeded:#4FE3D6;
    --btn-success:#4ADE80;  --on-success:#00220E;
    --btn-rx:#000000;       --on-rx:#FFD400;  --btn-rx-border:#FFD400;
    --btn-cart:#FF9830;     --on-cart:#1A1A1A;
    --btn-secondary:#000000; --on-secondary:#FFFFFF;
    --bw:2.5px;
    --sh-1:none; --sh-2:none;
}

/* ---------- Tiiviys ---------- */
body[data-density="tiivis"]{ --pad:0.85rem; --gap:0.5rem; }

/* ---------- Perusta ---------- */
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:0.94rem;
    line-height:1.5;
    min-height:100vh;
    /* Taulukkonumerot: päivämäärät ja luvut pysyvät samassa linjassa */
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    padding:1rem 1rem calc(4.6rem + env(safe-area-inset-bottom));
    transition:background-color .25s,color .25s;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--text)}
.container{max-width:34rem;margin:0 auto}

h1{
    color:var(--brand-text);text-align:center;font-size:1.5rem;
    margin:.25rem 0 1.1rem;letter-spacing:-.02em;
}

/* ---------- Napit ---------- */
.btn{
    display:block;width:100%;padding:.82rem 1rem;border-radius:var(--r-btn);
    font-size:1rem;font-weight:600;text-align:center;margin-bottom:.55rem;
    border:var(--bw) solid transparent;transition:filter .15s,transform .08s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-success{background:var(--btn-success);color:var(--on-success)}
.btn-secondary{background:var(--btn-secondary);color:var(--on-secondary);border-color:var(--border-strong);font-size:.9rem}
.btn-danger{background:var(--danger);color:#fff}
.btn-rx{background:var(--btn-rx);color:var(--on-rx);border-color:var(--btn-rx-border)}
.btn-cart{background:var(--btn-cart);color:var(--on-cart)}
.btn-cart:disabled{opacity:.55;cursor:default}
.btn:disabled{cursor:default}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.9rem}
.btn-row .btn{margin-bottom:0}
.btn-ghost{
    display:inline-block;width:auto;padding:.4rem .7rem;border-radius:var(--r-btn);
    font-size:.8rem;font-weight:600;background:var(--surface-2);
    border:var(--bw) solid var(--border);color:var(--text-soft);margin:0 .35rem .35rem 0;
}
.btn-ghost.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* ---------- Tallennusilmoitus ---------- */
#saveStatus{
    position:fixed;top:0;left:0;right:0;padding:.5rem;text-align:center;
    font-size:.82rem;font-weight:700;z-index:60;opacity:0;transition:opacity .4s;
    pointer-events:none;color:#fff;
}

/* ---------- Kirjautuminen ---------- */
#loginScreen{
    position:fixed;inset:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;z-index:80;padding:1.25rem;
}
.login-box{
    background:var(--surface);border:var(--bw) solid var(--border);
    border-radius:var(--r-card);padding:2rem 1.6rem;width:100%;max-width:22rem;box-shadow:var(--sh-2);
}
.login-title{font-size:1.5rem;font-weight:800;color:var(--brand-text);text-align:center;margin-bottom:.2rem}
.login-sub{font-size:.88rem;color:var(--text-faint);text-align:center;margin-bottom:1.4rem}
label{display:block;font-size:.82rem;font-weight:700;color:var(--text-soft);margin:.75rem 0 .3rem}
label:first-of-type{margin-top:0}
input[type=email],input[type=password],input[type=text],input[type=number],input[type=date]{
    width:100%;padding:.75rem .85rem;border:var(--bw) solid var(--border-strong);
    border-radius:var(--r-btn);font-size:1rem;background:var(--surface);outline:none;
    transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px hsl(var(--h) 70% 45% / .18)}
.login-error{color:var(--danger);font-size:.82rem;font-weight:700;text-align:center;margin-top:.8rem;min-height:1.2rem}

/* ---------- Käyttäjäpalkki ---------- */
.user-bar{
    display:flex;justify-content:space-between;align-items:center;gap:.6rem;
    background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-btn);
    padding:.6rem .85rem;margin-bottom:1rem;font-size:.8rem;color:var(--text-soft);
}
.user-bar span{font-weight:600;color:var(--brand-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{color:var(--danger);font-size:.82rem;font-weight:700;padding:.2rem .4rem;white-space:nowrap}

/* ---------- Lääkekortit ---------- */
.med-list{margin-top:.4rem}
.med-card{
    background:var(--surface);border:var(--bw) solid var(--border);
    border-left:5px solid var(--type-daily);
    border-radius:var(--r-card);padding:var(--pad);margin-bottom:var(--gap);
    box-shadow:var(--sh-1);
}
.med-card.asneeded-card{border-left-color:var(--type-asneeded)}
.med-card.hero{
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    color:var(--on-brand);border-color:transparent;border-left-color:rgba(255,255,255,.55);
    box-shadow:var(--sh-2);
}
/* Tilan korostus on kolmiportainen. Vasen reuna jätetään aina
   rauhaan, koska se kertoo lääkkeen tyypin. */
.med-card.st-warn{border-top-color:var(--warn-border);border-right-color:var(--warn-border);border-bottom-color:var(--warn-border)}
.med-card.st-crit{border-top-color:var(--danger-border);border-right-color:var(--danger-border);border-bottom-color:var(--danger-border)}
.med-card.st-warn.fill:not(.hero){background:var(--warn-bg)}
.med-card.st-crit.fill:not(.hero){background:var(--danger-bg)}
.med-header{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;margin-bottom:.3rem}
.med-header h3{font-size:1.12rem;color:var(--brand-text);flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.med-card.hero .med-header h3{color:var(--on-brand)}
.med-actions{display:flex;gap:.35rem;flex-shrink:0}
.icon-btn{
    padding:.4rem .55rem;font-size:.85rem;border-radius:var(--r-btn);
    background:var(--surface-2);border:var(--bw) solid var(--border);
}
.med-card.hero .icon-btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:var(--on-brand)}
.type-chip{
    display:inline-block;font-size:.68rem;font-weight:700;padding:.15rem .5rem;
    border-radius:var(--r-pill);background:var(--surface-2);color:var(--type-daily);
    border:1px solid currentColor;margin-bottom:.35rem;
}
.type-chip.asneeded{color:var(--type-asneeded)}
.type-chip.form-chip{color:var(--text-soft);margin-left:.3rem}
.med-card.hero .type-chip{background:rgba(255,255,255,.2);color:var(--on-brand)}
.med-days-number{font-size:2.6rem;font-weight:800;line-height:1;margin:.35rem 0 .1rem}
.med-days-label{font-size:.82rem;color:var(--text-soft)}
.med-card.hero .med-days-label{color:var(--on-brand);opacity:.9}
.med-info-row{font-size:.87rem;color:var(--text-soft);margin:.22rem 0}
.med-card.hero .med-info-row{color:var(--on-brand);opacity:.92}
.badge{
    display:inline-block;padding:.28rem .7rem;border-radius:var(--r-pill);
    font-size:.75rem;font-weight:700;margin:.4rem .35rem 0 0;
    border:1px solid transparent;
}
.badge-package-warning,.badge-rx-warning{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.badge-package-critical,.badge-rx-critical{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.badge-neutral{background:var(--brand-soft);color:var(--brand-text);border-color:var(--border)}
.badge-cart{background:#FFE8CC;color:#8A4B00;border-color:#F0C089}
.med-card.hero .badge{background:rgba(255,255,255,.92);color:var(--brand-text);border-color:transparent}
.med-buttons{margin-top:.9rem}

/* ---------- Lomakkeet ---------- */
.form-card{
    background:var(--surface);border:var(--bw) solid var(--brand);
    border-radius:var(--r-card);padding:var(--pad);margin-bottom:var(--gap);box-shadow:var(--sh-1);
}
.form-card h3{color:var(--brand-text);margin-bottom:.8rem;font-size:1.02rem}
.form-error{color:var(--danger);font-size:.82rem;font-weight:700;margin-top:.6rem;min-height:1.1rem}
.hint{font-size:.78rem;color:var(--text-faint);margin-top:.3rem}
.quick-picks{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.mode-toggle{display:flex;gap:.5rem;margin-bottom:.9rem}
.mode-toggle button{
    flex:1;padding:.6rem .4rem;border-radius:var(--r-btn);border:var(--bw) solid var(--border-strong);
    background:var(--surface);color:var(--text-soft);font-size:.82rem;font-weight:700;
}
.mode-toggle button.active{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.pkg-form-card{
    background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-card);
    overflow:hidden;margin-bottom:var(--gap);box-shadow:var(--sh-1);
}
.pkg-form-header{background:var(--brand);color:var(--on-brand);padding:1.1rem 1.2rem}
.pkg-form-header.rx{background:var(--warn-bg);color:var(--warn);border-bottom:var(--bw) solid var(--warn-border)}
.pkg-form-tag{
    display:inline-block;background:rgba(255,255,255,.25);padding:.2rem .6rem;
    border-radius:var(--r-pill);font-size:.7rem;font-weight:800;margin-bottom:.4rem;
}
.pkg-form-header.rx .pkg-form-tag{background:rgba(0,0,0,.08)}
.pkg-form-header h3{font-size:1.2rem;font-weight:800;overflow-wrap:break-word}
.pkg-form-body{padding:var(--pad)}
.pkg-form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}

/* ---------- Haku ---------- */
.search-box{position:relative;margin:.15rem 0 .7rem}
.search-box input{
    width:100%;padding:.72rem 2.4rem .72rem 2.3rem;border-radius:var(--r-pill);
    border:var(--bw) solid var(--border-strong);background:var(--surface);font-size:.95rem;
}
.search-box .mag{
    position:absolute;left:.85rem;top:50%;transform:translateY(-50%);
    font-size:.9rem;color:var(--text-faint);pointer-events:none;
}
.search-box .clear{
    position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
    padding:.3rem .5rem;border-radius:var(--r-pill);color:var(--text-faint);font-size:.9rem;
}
.search-box .clear:hover{background:var(--surface-2);color:var(--text)}
.search-note{font-size:.76rem;color:var(--text-faint);margin:-.45rem 0 .7rem;padding-left:.3rem}
.is-hidden{display:none !important}

/* ---------- Kategoriasuodatin ---------- */
.filter-row{display:flex;gap:.4rem;margin:.15rem 0 .9rem}
.fchip{
    flex:1;padding:.55rem .3rem;border-radius:var(--r-pill);
    border:var(--bw) solid var(--border-strong);background:var(--surface);
    color:var(--text-soft);font-size:.78rem;font-weight:700;line-height:1.25;
}
.fchip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.fchip .n{opacity:.75;font-weight:600}

/* ---------- Väriveistimet ---------- */
.color-row{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
.color-row:last-of-type{border-bottom:none}
.color-row .lbl{flex:1;font-size:.88rem}
.color-row .lbl small{display:block;color:var(--text-faint);font-size:.72rem;margin-top:.1rem}
.color-row input[type=color]{
    flex-shrink:0;width:2.8rem;height:2.1rem;padding:0;border-radius:var(--r-btn);
    border:var(--bw) solid var(--border-strong);background:none;cursor:pointer;
}
.color-row .reset{
    flex-shrink:0;font-size:.72rem;font-weight:700;color:var(--text-faint);
    padding:.35rem .45rem;border-radius:var(--r-btn);border:var(--bw) solid var(--border);
}
.color-row .reset.hidden{visibility:hidden}
.own-flag{font-size:.68rem;color:var(--brand-text);font-weight:700}

/* ---------- Osiot ja tilat ---------- */
.section-title{font-size:.8rem;color:var(--text-faint);letter-spacing:.04em;margin:1.3rem 0 .6rem;font-weight:800}
.empty-state{
    text-align:center;color:var(--text-faint);padding:2.2rem 1rem;
    background:var(--surface);border:var(--bw) dashed var(--border-strong);border-radius:var(--r-card);
}
.info-banner{
    background:var(--brand-soft);border:var(--bw) solid var(--border);color:var(--brand-text);
    border-radius:var(--r-btn);padding:.85rem;margin-bottom:1rem;font-size:.82rem;font-weight:600;
}

/* ---------- Reseptilistaus ---------- */
.rx-card{
    background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-card);
    padding:1.1rem 1.2rem;margin-bottom:var(--gap);box-shadow:var(--sh-1);
}
.rx-card.rx-warning{border-color:var(--warn-border);background:var(--warn-bg)}
.rx-card.rx-critical{border-color:var(--danger-border);background:var(--danger-bg)}
.rx-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.rx-card-top h3{font-size:1.12rem;color:var(--brand-text);flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.rx-days-chip{
    flex-shrink:0;text-align:center;background:var(--brand);color:var(--on-brand);
    border-radius:var(--r-btn);padding:.45rem .9rem;min-width:3.4rem;
}
.rx-days-chip .num{font-size:1.5rem;font-weight:800;line-height:1;display:block}
.rx-days-chip .unit{font-size:.62rem;opacity:.9;letter-spacing:.04em}
.rx-days-chip.warning{background:var(--warn);color:#fff}
.rx-days-chip.critical{background:var(--danger);color:#fff}
.rx-card-date{font-size:.9rem;color:var(--text-soft);font-weight:600;margin-top:.6rem}

/* ---------- Asetukset ---------- */
.set-group{
    background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-card);
    margin-bottom:var(--gap);overflow:hidden;box-shadow:var(--sh-1);
}
.set-head{
    display:flex;align-items:center;gap:.6rem;width:100%;padding:1rem var(--pad);
    font-size:1rem;font-weight:700;text-align:left;color:var(--text);
}
.set-head .arrow{margin-left:auto;color:var(--text-faint);font-size:.8rem;transition:transform .2s}
.set-group.open .set-head .arrow{transform:rotate(90deg)}
.set-body{padding:0 var(--pad) var(--pad);border-top:var(--bw) solid var(--border)}
.set-row{display:flex;align-items:center;gap:.75rem;padding:.65rem 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1;font-size:.9rem}
.set-row .lbl small{display:block;color:var(--text-faint);font-size:.74rem;font-weight:400;margin-top:.1rem}
.switch{
    flex-shrink:0;width:2.9rem;height:1.65rem;border-radius:var(--r-pill);background:var(--border-strong);
    position:relative;transition:background .2s;border:var(--bw) solid transparent;
}
.switch.on{background:var(--brand)}
.switch::after{
    content:'';position:absolute;top:.17rem;left:.17rem;width:1.2rem;height:1.2rem;
    border-radius:50%;background:#fff;transition:transform .2s;box-shadow:var(--sh-1);
}
.switch.on::after{transform:translateX(1.25rem)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.4rem,1fr));gap:.5rem;margin:.5rem 0 .2rem}
.theme-btn{
    border:var(--bw) solid var(--border-strong);border-radius:var(--r-btn);padding:.5rem .3rem;
    font-size:.76rem;font-weight:700;color:var(--text-soft);background:var(--surface);
}
.theme-btn.on{border-color:var(--brand);color:var(--brand-text);background:var(--brand-soft)}
.theme-dot{display:block;width:100%;height:1.4rem;border-radius:6px;margin-bottom:.35rem}
.preview{
    border:var(--bw) dashed var(--border-strong);border-radius:var(--r-card);
    padding:.7rem;margin:.6rem 0 .2rem;background:var(--surface-2);
}
.preview .plabel{font-size:.72rem;color:var(--text-faint);font-weight:700;margin-bottom:.4rem}
input[type=range]{width:100%;accent-color:var(--brand);height:1.6rem}
.hue-track{
    height:.7rem;border-radius:var(--r-pill);margin-bottom:.2rem;
    background:linear-gradient(90deg,hsl(0 70% 45%),hsl(60 70% 45%),hsl(120 70% 45%),hsl(180 70% 45%),hsl(240 70% 45%),hsl(300 70% 45%),hsl(360 70% 45%));
}
.scale-row{display:flex;gap:.4rem;margin-top:.4rem}
.scale-row button{
    flex:1;padding:.55rem .2rem;border-radius:var(--r-btn);border:var(--bw) solid var(--border-strong);
    background:var(--surface);color:var(--text-soft);font-weight:700;
}
.scale-row button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.scale-row button:nth-child(1){font-size:.75rem}
.scale-row button:nth-child(2){font-size:.88rem}
.scale-row button:nth-child(3){font-size:1rem}
.scale-row button:nth-child(4){font-size:1.15rem}
.import-preview{
    background:var(--brand-soft);border:var(--bw) solid var(--brand);border-radius:var(--r-btn);
    padding:.85rem;margin-top:.6rem;font-size:.85rem;
}

    display:block;text-align:center;padding:.82rem 1rem;border-radius:var(--r-btn);

.tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;

}

    flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;

}

.pin-title{font-size:1.1rem;font-weight:800;color:var(--brand-text);margin-bottom:.3rem}
.pin-sub{font-size:.84rem;color:var(--text-faint);margin-bottom:1.2rem}

// Asetusnäkymän PIN. Tämä on kevyt suoja omalle puhelimelle, ei

// ============================================================

//  hälytysrajaa. Siksi uudet kentät yhdistetään aina oletuksiin,

const DEFAULT_SETTINGS = {
    packageWarningDays: 10,
    packageCriticalDays: 3,
    rxWarningDays: 30,
    rxCriticalDays: 7,
    theme: 'meri',
    accentHue: 194,
    textScale: 1,

    cardHighlight: 'ei',      // 'ei' | 'reuna' | 'taysi'
    showAllFilter: false,     // näytetäänkö Kaikki-nappi suodattimessa
    showSearch: true,         // näytetäänkö hakukenttä etusivulla
    // Tyhjä arvo tarkoittaa että teeman oma väri on käytössä.
    colors: { bg:'', surface:'', text:'', brand:'', success:'', rx:'', cart:'', secondary:'' },
    cardFields: { pkgInfo:true, startDate:true, endDate:true, rx:true, badges:true, cart:true, form:true },
    defaults: { packageSize:'', dosePerDay:'', rxYears:2 }
};

// Teemojen korostusvärit on kuvattu myös täällä, koska kontrastin
// laskenta tarvitsee todelliset luvut. Arvot vastaavat tyylitiedoston
// hsl()-määrityksiä – jos muutat toista, muuta myös toinen.
const THEMES = {
    meri:      { name:'Meri',      hue:194, dark:false, bs:78, bl:30 },
    metsa:     { name:'Metsä',     hue:152, dark:false, bs:78, bl:30 },
    hiekka:    { name:'Hiekka',    hue:32,  dark:false, bs:78, bl:30 },
    yo:        { name:'Yö',        hue:194, dark:true,  bs:62, bl:42 },
    kontrasti: { name:'Kontrasti', hue:210, dark:true,  bs:85, bl:42 }
};
const TEXT_SCALES = [
    { v:0.9,  label:'Pieni' },
    { v:1,    label:'Normaali' },
    { v:1.12, label:'Suuri' },
    { v:1.28, label:'Erittäin suuri' }
];

// ============================================================
//  LÄÄKEMUODOT
//  Muoto määrää yksikön ja sen, lasketaanko pakkauksen riitto
//  annoksista. Tahnalle tai voiteelle laskenta ei ole mielekäs,
//  joten niille seurataan vain reseptiä ja pakkauksia. Jokaisen
//  lääkkeen kohdalla laskennan voi silti kytkeä käsin päälle.
// ============================================================
// ============================================================
//  RESEPTIN MÄÄRÄ
//  Reseptiin voi olla kirjattu pakkausten määrä, hoitojakson
//  pituus (vuoden annos) tai kokonaismäärä yksikköinä. Nämä ovat

const RX_TYPES = {

    amount:   { name:'Määränä',      icon:'🔢', hint:'Kokonaismäärä yksikköinä' },
    none:     { name:'Ei merkintää', icon:'➖', hint:'Seurataan vain voimassaoloa' }
};
const RX_UNITS = { kk:'kuukautta', v:'vuotta' };

const FORMS = {
    pilleri:      { name:'Pilleri',      icon:'💊', unit:'pilleriä',      per:'pilleriä/pv',      track:true  },
    neste:        { name:'Neste',        icon:'💧', unit:'ml',            per:'ml/pv',            track:true  },
    inhalaattori: { name:'Inhalaattori', icon:'🌬️', unit:'annosta',       per:'annosta/pv',       track:true  },
    suihke:       { name:'Suihke',       icon:'💨', unit:'annosta',       per:'annosta/pv',       track:true  },
    tahna:        { name:'Tahna',        icon:'🪥', unit:'käyttökertaa',  per:'käyttökertaa/pv',  track:false },
    voide:        { name:'Voide',        icon:'🧴', unit:'käyttökertaa',  per:'käyttökertaa/pv',  track:false },
    muu:          { name:'Muu',          icon:'📦', unit:'yksikköä',      per:'yksikköä/pv',      track:false }
};

function cloneSettings(s){

        defaults:   { ...DEFAULT_SETTINGS.defaults,   ...((s && s.defaults)   || {}) }
    };
}

// ============================================================
//  TILA
// ============================================================
let data = { medicines: {}, settings: cloneSettings(null) };
let settings = data.settings;
let legacyDataDetected = false;
let isSaving = false;
let savePending = false;
let unsubSnapshot = null;
let settingsUnlocked = false;   // PIN kysytään kerran istunnossa
let pendingImport = null;       // tuotavat tiedot odottamassa vahvistusta

let ui = {
    view:'dashboard', addFormOpen:false, addFormMode:'daily',
    addForm:'pilleri', addTrack:true, addRxType:'packages', addRxUnit:'v', draft:{},
    editId:null, editFormMode:null, editForm:null, editTrack:null,
    editRxType:null, editRxUnit:null, editDraft:{},
    newPackageId:null, newRxId:null, newRxType:null, newRxUnit:null, newRxDraft:{},
    settingsSection:'ulkoasu', pinInput:'', pinError:'', medFilter:null, search:''
};

// ============================================================
//  VÄRILASKENTA
//  Korostusvärin päällä oleva teksti valitaan automaattisesti:
//  lasketaan taustan suhteellinen luminanssi ja verrataan valkoisen
//  ja tumman musteen kontrastia. Näin liukusäätimen ääriasennotkin
//  pysyvät luettavina ilman käsin valittuja poikkeuksia.
// ============================================================
function hslToRgb(h, s, l){
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const c = (1 - Math.abs(2*l - 1)) * s;
    const x = c * (1 - Math.abs((h/60) % 2 - 1));
    const m = l - c/2;
    let r=0, g=0, b=0;
    if(h < 60){ r=c; g=x; }
    else if(h < 120){ r=x; g=c; }
    else if(h < 180){ g=c; b=x; }
    else if(h < 240){ g=x; b=c; }
    else if(h < 300){ r=x; b=c; }
    else { r=c; b=x; }
    return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function relativeLuminance([r,g,b]){
    const f = v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
    return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
}
function contrastRatio(l1, l2){
    const a = Math.max(l1, l2), b = Math.min(l1, l2);
    return (a + 0.05) / (b + 0.05);
}
const INK_DARK = [14,26,34];
function readableInkFor(rgb){
    const lum   = relativeLuminance(rgb);
    const white = contrastRatio(lum, 1);
    const dark  = contrastRatio(lum, relativeLuminance(INK_DARK));
    return white >= dark ? '#FFFFFF' : '#0E1A22';
}
function bestContrast(rgb){
    const lum = relativeLuminance(rgb);
    return Math.max(contrastRatio(lum, 1), contrastRatio(lum, relativeLuminance(INK_DARK)));
}
// Osa sävyistä (esim. keltavihreä) on keskikirkkaita: niiden päällä
// ei valkoinen eikä tumma teksti yllä riittävään kontrastiin. Siksi
// väriä siirretään vaaleus kerrallaan siihen suuntaan, jonne teksti
// jo kallistuu, kunnes 4.5:1 täyttyy. Sävy säilyy, vain kirkkaus muuttuu.
function readableBrand(h, s, l){
    let lightness = l;
    let rgb = hslToRgb(h, s, lightness);
    let guard = 0;
    while(bestContrast(rgb) < 4.5 && guard++ < 60){
        lightness += (readableInkFor(rgb) === '#FFFFFF') ? -1.5 : 1.5;
        if(lightness < 0 || lightness > 100) break;
        rgb = hslToRgb(h, s, lightness);
    }
    return { rgb, ink: readableInkFor(rgb) };
}
function rgbToHex([r,g,b]){
    return '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
}
function hexToRgb(hex){
    let h = String(hex || '').trim().replace('#','');
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if(!/^[0-9a-f]{6}$/i.test(h)) return null;
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
// Kahden värin sekoitus. t = 0 antaa ensimmäisen, t = 1 toisen.
function mixRgb(a, b, t){
    return [0,1,2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
}
// Siirtää väriä vaaleampaan tai tummempaan suuntaan kunnes se erottuu
// taustastaan. Käytetään omille väreille: kun valitset vaikka tumman
// korostusvärin vaalealle taustalle, otsikot pysyvät silti luettavina.
function shiftUntilReadable(rgb, bgRgb, target){
    const bgLum = relativeLuminance(bgRgb);
    const towards = bgLum < 0.5 ? [255,255,255] : [0,0,0];
    let cur = rgb.slice(), guard = 0;
    while(contrastRatio(relativeLuminance(cur), bgLum) < (target || 4.5) && guard++ < 40){
        cur = mixRgb(cur, towards, 0.08);
    }
    return cur;
}
// Lukee voimassa olevan värin CSS-muuttujasta heksalukuna, jotta
// väriveistin avautuu nykyisessä värissä eikä mustassa.
function cssHex(name){
    const raw = getComputedStyle(document.body).getPropertyValue(name).trim();
    const rgb = hexToRgb(raw);
    if(rgb) return rgbToHex(rgb);
    const m = raw.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/);
    if(m) return rgbToHex([+m[1], +m[2], +m[3]]);
    return '#808080';
}

// ============================================================
//  TEEMAN KÄYTTÖÖNOTTO
//  Tämä koskee vain CSS-muuttujia, joten sitä voi kutsua myös
//  kesken liukusäätimen vetämisen ilman että näkymä piirtyy
//  uudelleen ja säädin hyppää takaisin alkuun.
// ============================================================
function applyTheme(){
    const th = THEMES[settings.theme] || THEMES.meri;
    const hue = Number.isFinite(+settings.accentHue) ? +settings.accentHue : th.hue;

    document.body.dataset.theme   = settings.theme in THEMES ? settings.theme : 'meri';
    document.body.dataset.density = settings.density === 'tiivis' ? 'tiivis' : 'normal';

    // --h ja --fs elävät html-elementissä, koska html:n oma
    // fonttikoko lasketaan niistä.
    const root = document.documentElement;
    root.style.setProperty('--h', hue);
    root.style.setProperty('--fs', settings.textScale || 1);

    // Korostusvärit kirjoitetaan bodyyn valmiiksi laskettuina, jotta
    // ne voittavat teemasäännöt ja kontrasti on aina varmistettu.
    const brand  = readableBrand(hue, th.bs, th.bl);
    const brand2 = readableBrand(hue - 17, th.bs - 2, th.bl + 13);
    const b = document.body.style;
    b.setProperty('--brand', rgbToHex(brand.rgb));
    b.setProperty('--brand-2', rgbToHex(brand2.rgb));
    b.setProperty('--on-brand', brand.ink);
    b.setProperty('--on-brand-2', brand2.ink);

    const meta = document.getElementById('themeColorMeta');
    if(meta) meta.setAttribute('content', rgbToHex(brand.rgb));

    applyCustomColors();
}

// ============================================================
//  OMAT VÄRIT
//  Nämä kirjoitetaan teeman päälle. Jokaisesta valitusta väristä
//  johdetaan myös sen lähisukulaiset: taustasta reunaviivat,
//  tekstistä haaleammat tekstit ja napeista niiden tekstin väri.
//  Mitään väriparia ei tarvitse valita käsin.
// ============================================================
function applyCustomColors(){
    const b = document.body.style;
    const c = settings.colors || {};
    const th = THEMES[settings.theme] || THEMES.meri;

    // Nollataan aiemmat omat värit, jotta teeman poistuessa
    // vanha valinta ei jää roikkumaan.
    ['--bg','--surface','--surface-2','--border','--border-strong',
     '--text','--text-soft','--text-faint','--brand-text','--brand-soft',
     '--btn-success','--on-success','--btn-rx','--on-rx','--btn-rx-border',
     '--btn-cart','--on-cart','--btn-secondary','--on-secondary'
    ].forEach(k => b.removeProperty(k));

    const bgRgb   = hexToRgb(c.bg);
    const surfRgb = hexToRgb(c.surface);
    const textRgb = hexToRgb(c.text);
    const brandRgb = hexToRgb(c.brand);

    // Jos omia värejä ei ole valittu, lopetetaan tähän. Näin
    // korostusvärin liukusäädin ei joudu lukemaan laskettuja
    // tyylejä jokaisella pikselillä.
    if(!Object.values(c).some(Boolean)) return;

    // Vertailuväreinä käytetään omaa valintaa jos sellainen on,
    // muuten teeman oletusta.
    const surfRef = surfRgb || hexToRgb(cssHex('--surface')) || (th.dark ? [25,34,42] : [255,255,255]);
    const textRef = textRgb || hexToRgb(cssHex('--text'))    || (th.dark ? [233,239,243] : [21,39,48]);

    if(bgRgb) b.setProperty('--bg', rgbToHex(bgRgb));

    if(surfRgb){
        b.setProperty('--surface', rgbToHex(surfRgb));
        b.setProperty('--surface-2', rgbToHex(mixRgb(surfRgb, textRef, 0.07)));
        b.setProperty('--border', rgbToHex(mixRgb(surfRgb, textRef, 0.20)));
        b.setProperty('--border-strong', rgbToHex(mixRgb(surfRgb, textRef, 0.34)));
    }
    if(textRgb){
        b.setProperty('--text', rgbToHex(textRgb));
        b.setProperty('--text-soft', rgbToHex(mixRgb(textRgb, surfRef, 0.30)));
        b.setProperty('--text-faint', rgbToHex(mixRgb(textRgb, surfRef, 0.48)));
    }
    if(brandRgb){
        b.setProperty('--brand', rgbToHex(brandRgb));
        b.setProperty('--on-brand', readableInkFor(brandRgb));
        const brand2 = mixRgb(brandRgb, th.dark ? [255,255,255] : [0,0,0], 0.16);
        b.setProperty('--brand-2', rgbToHex(brand2));
        b.setProperty('--on-brand-2', readableInkFor(brand2));
        b.setProperty('--brand-text', rgbToHex(shiftUntilReadable(brandRgb, surfRef, 4.5)));
        b.setProperty('--brand-soft', rgbToHex(mixRgb(surfRef, brandRgb, 0.14)));
    }

    const nappi = (hexValue, bgVar, inkVar, extraVar) => {
        const rgb = hexToRgb(hexValue);
        if(!rgb) return;
        b.setProperty(bgVar, rgbToHex(rgb));
        b.setProperty(inkVar, readableInkFor(rgb));
        if(extraVar) b.setProperty(extraVar, rgbToHex(rgb));
    };
    nappi(c.success,   '--btn-success',   '--on-success');
    nappi(c.rx,        '--btn-rx',        '--on-rx', '--btn-rx-border');
    nappi(c.cart,      '--btn-cart',      '--on-cart');
    nappi(c.secondary, '--btn-secondary', '--on-secondary');
}

// Jos tallennus on jo käynnissä, muutosta ei enää hylätä hiljaa vaan
// se jää jonoon ja kirjoitetaan heti edellisen valmistuttua.
async function saveData(){
    if(isSaving){ savePending = true; return; }
    isSaving = true;
    showSaveStatus('💾 Tallennetaan...', '#f97316');
    try {
        localStorage.setItem('laakevahti_bkp', JSON.stringify(data));
        await setDoc(DATA_DOC, { json: JSON.stringify(data) });
        showSaveStatus('✅ Tallennettu', '#22c55e');
    } catch(e){
        showSaveStatus('❌ Tallennus epäonnistui', '#dc2626');
        console.error(e);
    }
    isSaving = false;
    if(savePending){ savePending = false; await saveData(); }
}

function normalizeLoadedData(parsed){
    if(parsed && parsed.medicines && typeof parsed.medicines === 'object'){
        Object.values(parsed.medicines).forEach(m => {
            if(!m.mode) m.mode = 'daily';
            if(typeof m.prescriptionTotalPackages === 'undefined') m.prescriptionTotalPackages = null;
            if(typeof m.prescriptionPackagesUsed === 'undefined') m.prescriptionPackagesUsed = 0;
        });
        parsed.settings = cloneSettings(parsed.settings);
        settings = parsed.settings;
        applyTheme();
        return parsed;
    }
    legacyDataDetected = true;
    const fresh = { medicines: {}, settings: cloneSettings(null) };
    settings = fresh.settings;
    applyTheme();
    return fresh;
}

async function loadFromFirebase(){
    try {
        const snap = await getDoc(DATA_DOC);
        if(snap.exists()){
            data = normalizeLoadedData(JSON.parse(snap.data().json));
        } else {
            const bkp = localStorage.getItem('laakevahti_bkp');
            if(bkp){
                try { data = normalizeLoadedData(JSON.parse(bkp)); await saveData(); }
                catch(e){ data = normalizeLoadedData(null); }
            }
        }
    } catch(e){
        const bkp = localStorage.getItem('laakevahti_bkp');
        if(bkp) try { data = normalizeLoadedData(JSON.parse(bkp)); } catch(e2){}
        showSaveStatus('⚠️ Yhteysvirhe – paikallinen data', '#f59e0b');
    }
    render();
    if(unsubSnapshot) unsubSnapshot();
    unsubSnapshot = onSnapshot(DATA_DOC, snap => {
        if(!snap.exists() || isSaving) return;
        try {
            data = normalizeLoadedData(JSON.parse(snap.data().json));
            // Avointa lomaketta tai asetussivua ei piirretä uusiksi,
            // jottei kesken oleva syöttö katoa toisen laitteen tallennuksesta.
            if(canRedraw()) render();
        } catch(e){}
    });
}

// ============================================================
//  KAUPPALISTA-INTEGRAATIO
//  Kauppalista-sovellus käyttää SAMAA Firebase-projektia, joten tästä
//  voidaan kirjoittaa suoraan sen omaan polkuun. Kauppalistan koodiin
//  ei tarvitse koskea: se kuuntelee koko lists-kokoelmaa onSnapshotilla,
//  joten lisätty tuote ilmestyy sen ruudulle itsestään.
//
//  'ISKÄ' kirjoitetaan \u00C4-pakosarjalla, koska se on Firestore-
//  dokumentin TUNNISTE. Jos tiedosto joskus tallentuu väärällä
//  merkistöllä, tunniste ei enää täsmäisi ja tuotteet valuisivat
//  väärään paikkaan.
// ============================================================
const KAUPPA_KAYTTAJA  = 'ISK\u00C4';
const KAUPPA_LISTA     = 'APTEEKKI';
const KAUPPA_KATEGORIA = 'apteekki';

const kauppaCol = () => collection(db, 'kauppalista', KAUPPA_KAYTTAJA, 'lists');
const kauppaRef = (id) => doc(db, 'kauppalista', KAUPPA_KAYTTAJA, 'lists', id);
const kauppaId  = () => Math.random().toString(36).slice(2, 11);

let kauppaLista = null;
let kauppaUnsub = null;
let kauppaLisays = null;

function tilaaKauppalista(){
    if(kauppaUnsub) return;
    kauppaUnsub = onSnapshot(kauppaCol(), snap => {
        let loydetty = null;
        snap.forEach(d => {
            const l = d.data() || {};
            if((l.name || '').toUpperCase() === KAUPPA_LISTA){
                loydetty = { id: d.id, items: Array.isArray(l.items) ? l.items : [] };
            }
        });
        kauppaLista = loydetty;
        if(canRedraw() && ui.view === 'dashboard') render();
    }, err => {
        console.warn('Kauppalistan kuuntelu epäonnistui', err);
    });
}

function lopetaKauppalista(){
    if(kauppaUnsub){ kauppaUnsub(); kauppaUnsub = null; }
    kauppaLista = null;
}

const kauppaNimi = (s) => String(s || '').trim().toUpperCase();

const KAUPPA_ODOTUS_MS = 4000;
function odotaKirjoitusta(lupaus){
    let ajastin;
    const aikakatkaisu = new Promise(resolve => {
        ajastin = setTimeout(() => resolve('odottaa'), KAUPPA_ODOTUS_MS);
    });
    return Promise.race([
        lupaus.then(() => 'valmis'),
        aikakatkaisu
    ]).finally(() => clearTimeout(ajastin));
}

function onKauppalistalla(nimi){
    if(!kauppaLista) return false;
    const n = kauppaNimi(nimi);
    return (kauppaLista.items || []).some(i => !i.done && kauppaNimi(i.name) === n);
}

window.lisaaKauppalistaan = async (medId) => {
    const m = data.medicines[medId];
    if(!m || kauppaLisays) return;
    const nimi = kauppaNimi(m.name);
    if(!nimi) return;

    if(onKauppalistalla(nimi)){
        showSaveStatus('🛒 ' + nimi + ' on jo listalla', '#f97316');
        return;
    }

    kauppaLisays = medId;
    render();
    showSaveStatus('🛒 Lisätään kauppalistaan...', '#ff9830');

    const tuote = { id: kauppaId(), name: nimi, qty: '1', done: false, cat: KAUPPA_KATEGORIA };

    try {
        let kohde = kauppaLista;
        let maxOrder = -1;
        if(!kohde){
            const snap = await getDocs(kauppaCol());
            snap.forEach(d => {
                const l = d.data() || {};
                if(typeof l.order === 'number' && l.order > maxOrder) maxOrder = l.order;
                if((l.name || '').toUpperCase() === KAUPPA_LISTA){
                    kohde = { id: d.id, items: Array.isArray(l.items) ? l.items : [] };
                }
            });
            if(kohde && (kohde.items || []).some(i => !i.done && kauppaNimi(i.name) === nimi)){
                showSaveStatus('🛒 ' + nimi + ' on jo listalla', '#f97316');
                return;
            }
        }

        let kirjoitus;
        if(kohde){
            kirjoitus = updateDoc(kauppaRef(kohde.id), {
                items: arrayUnion(tuote),
                updatedAt: Date.now()
            });
        } else {
            kirjoitus = setDoc(kauppaRef(kauppaId()), {
                name: KAUPPA_LISTA,
                order: maxOrder + 1,
                items: [tuote],
                updatedAt: Date.now()
            });
        }
        kirjoitus.catch(e => console.error('Kauppalistaan lisäys epäonnistui', e));

        const tulos = await odotaKirjoitusta(kirjoitus);
        if(tulos === 'odottaa'){
            showSaveStatus('⏳ Lähetetään kun verkko palaa', '#f59e0b');
        } else {
            showSaveStatus('✅ ' + nimi + ' lisätty kauppalistaan', '#22c55e');
        }
    } catch(e){
        console.error('Kauppalistaan lisäys epäonnistui', e);
        showSaveStatus('❌ Kauppalistaan lisäys epäonnistui', '#dc2626');
    } finally {
        kauppaLisays = null;
        render();
    }
};

// ============================================================
//  APUFUNKTIOT
// ============================================================
// Lääkkeen nimi tulee käyttäjältä ja se sijoitetaan HTML:ään.
// Ilman siistimistä esimerkiksi lainausmerkki nimessä rikkoisi
// lomakkeen kentän arvon ja kulmasulku koko kortin.
function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

// Hakua varten teksti riisutaan pieniksi kirjaimiksi ilman pisteitä
// ja pilkkuja kirjainten päällä. Näin duraphat löytyy myös ilman
// tarkkaa kirjoitusasua, ja laake löytää lääkkeen.
function normSearch(s){
    return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function getTodayString(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDate(dateStr){ if(!dateStr) return '-'; return new Date(dateStr+'T12:00:00').toLocaleDateString('fi-FI'); }
function addDaysToDate(dateStr, days){
    const d = new Date(dateStr+'T12:00:00');
    d.setDate(d.getDate()+days);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addYearsToDate(dateStr, years){
    const d = new Date(dateStr+'T12:00:00');
    d.setFullYear(d.getFullYear()+years);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
// Kuukausien lisäys niin että kuukauden viimeinen päivä pysyy
// järkevänä: 31.1. plus kuukausi on 28.2. eikä 3.3.
function addMonthsToDate(dateStr, months){
    const d = new Date(dateStr+'T12:00:00');
    const paiva = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    const viimeinen = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(paiva, viimeinen));
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function daysFromToday(dateStr){
    const end = new Date(dateStr+'T12:00:00');
    const today = new Date(); today.setHours(12,0,0,0);
    return Math.ceil((end-today)/(1000*60*60*24));
}

// Lääkemuodon apurit. Vanhoissa tallennuksissa muotoa ei ole, joten
// niitä kohdellaan pillereinä – laskenta säilyy täsmälleen entisellään.
function formOf(m){ return FORMS[m && m.form] ? m.form : 'pilleri'; }
function formInfo(m){ return FORMS[formOf(m)]; }
function tracksDoses(m){
    if(m && typeof m.trackDoses === 'boolean') return m.trackDoses;
    return formInfo(m).track;
}

function getPackageEndDate(m){
    // Tahnalle ja voiteelle riittoa ei lasketa, jolloin kortissa ei
    // näy päivälukua eikä pakkausvaroituksia.
    if(!tracksDoses(m)) return null;
    if(!m.packageSize || !m.dosePerDay || !m.startDate) return null;
    const totalDays = Math.floor(m.packageSize / m.dosePerDay);
    return addDaysToDate(m.startDate, totalDays);
}
function getPackageDaysRemaining(m){
    const end = getPackageEndDate(m);
    return end ? daysFromToday(end) : null;
}
function getPrescriptionDaysRemaining(m){ return m.prescriptionValidUntil ? daysFromToday(m.prescriptionValidUntil) : null; }
function getPrescriptionPackagesRemaining(m){
    if(!m.prescriptionTotalPackages) return null;
    const used = m.prescriptionPackagesUsed || 0;
    return Math.max(0, m.prescriptionTotalPackages - used);
}

// Reseptin määrän merkintätapa. Vanhoissa lääkkeissä tapaa ei ole
// kirjattu, joten se päätellään: jos pakkausmäärä on annettu, kyse
// on pakkauksista, muuten määrää ei ole merkitty.
function rxTypeOf(m){
    const t = m && m.rxType;
    if(t && RX_TYPES[t]) return t;
    return (m && m.prescriptionTotalPackages) ? 'packages' : 'none';
}
// Hoitojakson pituus kuukausina.
function rxDurationMonths(m){
    if(!m || !m.rxDurationValue) return null;
    const arvo = parseFloat(m.rxDurationValue);
    if(!arvo || arvo <= 0) return null;
    return m.rxDurationUnit === 'kk' ? Math.round(arvo) : Math.round(arvo * 12);
}
// Milloin reseptiin kirjattu annos on käytetty loppuun.
function rxPeriodEnd(m){
    if(rxTypeOf(m) !== 'duration') return null;
    const kk = rxDurationMonths(m);
    if(!kk || !m.rxStartDate) return null;
    return addMonthsToDate(m.rxStartDate, kk);
}
function rxPeriodDaysRemaining(m){
    const loppu = rxPeriodEnd(m);
    return loppu ? daysFromToday(loppu) : null;
}
function rxUnitsRemaining(m){
    if(rxTypeOf(m) !== 'amount' || !m.rxTotalUnits) return null;
    return Math.max(0, m.rxTotalUnits - (m.rxUsedUnits || 0));
}
// Lyhyt kuvaus reseptin määrästä, esim. 2 vuoden annos.
function rxAmountText(m){
    const tyyppi = rxTypeOf(m);
    if(tyyppi === 'packages'){
        return m.prescriptionTotalPackages ? m.prescriptionTotalPackages + ' pakkausta' : '';
    }
    if(tyyppi === 'duration'){
        const arvo = parseFloat(m.rxDurationValue) || 0;
        if(!arvo) return '';
        const yksikko = m.rxDurationUnit === 'kk'
            ? (arvo === 1 ? 'kuukauden' : arvo + ' kuukauden')
            : (arvo === 1 ? 'vuoden' : arvo + ' vuoden');
        return yksikko + ' annos';
    }
    if(tyyppi === 'amount'){
        return m.rxTotalUnits ? m.rxTotalUnits + ' ' + formInfo(m).unit : '';
    }
    return '';
}

async function handleLogin(){
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn      = document.getElementById('loginBtn');
    const err      = document.getElementById('loginError');

    if(!email || !password){ err.textContent = "Syötä sähköposti ja salasana."; return; }

    try {

// ============================================================
// Lomakkeen kentät talteen ennen uudelleenpiirtoa. Ilman tätä
// kirjoitettu nimi katoaisi aina kun muotoa tai tyyppiä vaihtaa.
function captureFields(ids, target){
    ids.forEach(id => {
        const el = document.getElementById(id);
        if(el) target[id] = el.value;
    });
}
function draftVal(store, id, oletus){
    return (store && typeof store[id] === 'string') ? store[id] : (oletus == null ? '' : oletus);
}
const ADD_IDS = ['newMedName','newMedRx','newMedTotal','newMedUsed','newMedSize','newMedDose','newMedStart',
                 'newMedDur','newMedRxStart','newMedUnits','newMedUsedUnits'];

// Lukee reseptin määräkentät valitun tavan mukaan ja palauttaa ne
// lääkkeeseen tallennettavassa muodossa.
function readRxAmount(pre, tyyppi, yksikko, suffix, sailyta){
    const sfx = suffix ? '_' + suffix : '';
    const num = (nimi) => {
        const el = document.getElementById(pre + nimi + sfx);
        if(!el || el.value === '') return null;
        const v = parseFloat(el.value);
        return isNaN(v) ? null : v;
    };
    // Haettujen pakkausten laskuri ei ole lomakkeella muissa kuin
    // pakkausmääräisessä reseptissä. Muokattaessa se säilytetään,
    // uutta reseptiä aloitettaessa nollataan.
    const vanhaPaketit = sailyta ? (sailyta.prescriptionPackagesUsed || 0) : 0;
    const vanhatYksikot = sailyta ? (sailyta.rxUsedUnits || 0) : 0;

    const tulos = {
        rxType: tyyppi,
        prescriptionTotalPackages: null, prescriptionPackagesUsed: vanhaPaketit,
        rxDurationValue: null, rxDurationUnit: yksikko, rxStartDate: null,
        rxTotalUnits: null, rxUsedUnits: vanhatYksikot
    };
    if(tyyppi === 'packages'){
        tulos.prescriptionTotalPackages = num('Total');
        tulos.prescriptionPackagesUsed = num('Used') || 0;
    } else if(tyyppi === 'duration'){
        tulos.rxDurationValue = num('Dur');
        const el = document.getElementById(pre + 'RxStart' + sfx);
        tulos.rxStartDate = (el && el.value) || getTodayString();
    } else if(tyyppi === 'amount'){
        tulos.rxTotalUnits = num('Units');
        tulos.rxUsedUnits = num('UsedUnits') || 0;
    }
    return tulos;
}

    const rx    = document.getElementById('newMedRx').value;

    if(!name){ err.textContent = 'Anna lääkkeen nimi.'; return; }

    const maara = readRxAmount('newMed', ui.addRxType || 'packages', ui.addRxUnit || 'v');

    const med = {
        name, mode, form,
        trackDoses: mode === 'daily' ? !!ui.addTrack : false,
        prescriptionValidUntil: rx || null,
        ...maara
    };

    if(mode === 'daily' && ui.addTrack){
        const sizeRaw  = document.getElementById('newMedSize').value;
        const doseRaw  = document.getElementById('newMedDose').value;
        const startRaw = document.getElementById('newMedStart').value;
        const size = sizeRaw ? parseFloat(sizeRaw) : null;
        const dose = doseRaw ? parseFloat(doseRaw) : null;
        med.packageSize = (size && size > 0) ? size : null;
        med.dosePerDay  = (dose && dose > 0) ? dose : null;
        med.startDate   = startRaw || ((med.packageSize && med.dosePerDay) ? getTodayString() : null);
    } else if(mode === 'daily'){
        const startRaw = document.getElementById('newMedStart');
        med.packageSize = null; med.dosePerDay = null;
        med.startDate = (startRaw && startRaw.value) || getTodayString();
    } else {
        med.packageSize = null; med.dosePerDay = null; med.startDate = null;
    }

    data.medicines[uid()] = med;
    ui.addFormOpen = false; ui.draft = {};
    await saveData(); render();
};

window.saveEditMedicine = async (id) => {
    const m = data.medicines[id]; if(!m) return;
    const mode  = ui.editFormMode || m.mode || 'daily';
    const form  = FORMS[ui.editForm] ? ui.editForm : formOf(m);
    const track = mode === 'daily' ? !!ui.editTrack : false;
    const name  = document.getElementById('editName_'+id).value.trim();
    const rx    = document.getElementById('editRx_'+id).value;
    const err   = document.getElementById('editError_'+id);

    if(!name){ err.textContent = 'Anna lääkkeen nimi.'; return; }

    const maara = readRxAmount('edit', ui.editRxType || 'packages', ui.editRxUnit || 'v', id, m);

    if(mode === 'daily' && track){
        const sizeRaw  = document.getElementById('editSize_'+id).value;
        const doseRaw  = document.getElementById('editDose_'+id).value;
        const startRaw = document.getElementById('editStart_'+id).value;
        const size = sizeRaw ? parseFloat(sizeRaw) : null;
        const dose = doseRaw ? parseFloat(doseRaw) : null;
        m.packageSize = (size && size > 0) ? size : null;
        m.dosePerDay  = (dose && dose > 0) ? dose : null;
        m.startDate   = startRaw || ((m.packageSize && m.dosePerDay) ? getTodayString() : null);
    } else if(mode === 'daily'){
        const startEl = document.getElementById('editStart_'+id);
        // Määrät jätetään tallentamatta mutta ei pyyhitä, jotta
        // laskennan voi kytkeä takaisin ilman että luvut katoavat.
        m.startDate = (startEl && startEl.value) || m.startDate || getTodayString();
    } else {
        m.packageSize = null; m.dosePerDay = null; m.startDate = null;
    }

    m.name = name; m.mode = mode; m.form = form; m.trackDoses = track;
    m.prescriptionValidUntil = rx || null;
    Object.assign(m, maara);

    ui.editId = null; ui.editFormMode = null; ui.editDraft = {};
    await saveData(); render();
};

window.deleteMedicine = async (id) => {
    const m = data.medicines[id];
    if(!confirm('Haluatko varmasti poistaa lääkkeen "' + (m ? m.name : '') + '"? Tätä ei voi perua.')) return;
    delete data.medicines[id];
    await saveData(); render();
};

window.openNewPackage = (id) => { ui.newPackageId = id; ui.addFormOpen = false; ui.editId = null; ui.newRxId = null; render(); };
window.cancelNewPackage = () => { ui.newPackageId = null; render(); };

window.saveNewPackage = async (id) => {
    const m = data.medicines[id]; if(!m) return;
    const start = document.getElementById('pkgStart_'+id).value || getTodayString();
    const err   = document.getElementById('pkgError_'+id);

    if(tracksDoses(m)){
        const size  = parseFloat(document.getElementById('pkgSize_'+id).value);
        const dose  = parseFloat(document.getElementById('pkgDose_'+id).value);
        const fi = formInfo(m);
        if(!size || size <= 0){ err.textContent = 'Anna pakkauksen määrä (' + fi.unit + ', yli 0).'; return; }
        if(!dose || dose <= 0){ err.textContent = 'Anna annos päivässä (yli 0).'; return; }
        m.packageSize = size; m.dosePerDay = dose;
    }

    // Reseptin laskuri kasvaa sen mukaan miten määrä on kirjattu:
    // pakkausmääräiseen lisätään pakkaus, määräiseen pakkauksen
    // sisältö. Ajanjaksoon perustuva ei tarvitse laskuria, mutta
    // haetut pakkaukset merkitään silti muistiin.
    if(m.prescriptionValidUntil){
        const tyyppi = rxTypeOf(m);
        m.prescriptionPackagesUsed = (m.prescriptionPackagesUsed || 0) + 1;
        if(tyyppi === 'amount' && m.packageSize){
            m.rxUsedUnits = (m.rxUsedUnits || 0) + m.packageSize;
        }
    }

    m.startDate = start;

    ui.newPackageId = null;
    await saveData(); render();
};

// Muotovalitsin: samat napit sekä lisäys- että muokkauslomakkeessa.
function formPicker(valittu, action){
    return `<div class="quick-picks" style="margin-bottom:.2rem">` +
        Object.entries(FORMS).map(([key, f]) =>
            `<button type="button" class="btn-ghost ${valittu===key?'on':''}" onclick="${action}('${key}')">${f.icon} ${f.name}</button>`
        ).join('') + `</div>`;
}

// Reseptin määräkentät. Sama rakenne lisäys-, muokkaus- ja
// uusi resepti -lomakkeessa, vain kenttien tunnisteet vaihtuvat.
function rxAmountFields(pre, tyyppi, yksikko, arvot, actionPrefix, fi, suffix){
    const sfx = suffix ? '_' + suffix : '';
    const chips = `<div class="quick-picks" style="margin-bottom:.2rem">` +
        Object.entries(RX_TYPES).map(([key, r]) =>
            `<button type="button" class="btn-ghost ${tyyppi===key?'on':''}" onclick="${actionPrefix}('${key}')">${r.icon} ${r.name}</button>`
        ).join('') + `</div>`;

    let kentat = '';
    if(tyyppi === 'packages'){
        kentat = `
        <label for="${pre}Total${sfx}">Pakkauksia reseptillä yhteensä</label>
        <input type="number" id="${pre}Total${sfx}" min="1" step="1" placeholder="esim. 3" value="${esc(arvot.total)}">

        <label for="${pre}Used${sfx}">Joista jo käytetty/ostettu</label>
        <input type="number" id="${pre}Used${sfx}" min="0" step="1" value="${esc(arvot.used)}">
        <div class="hint">Laskuri kasvaa itsestään kun aloitat uuden pakkauksen.</div>`;
    } else if(tyyppi === 'duration'){
        kentat = `
        <div class="pkg-form-row">
            <div>
                <label for="${pre}Dur${sfx}">Jakson pituus</label>
                <input type="number" id="${pre}Dur${sfx}" min="1" step="1" placeholder="esim. 1" value="${esc(arvot.dur)}">
            </div>
            <div>
                <label>Yksikkö</label>
                <div class="quick-picks" style="margin-top:.1rem">
                    <button type="button" class="btn-ghost ${yksikko==='kk'?'on':''}" onclick="${actionPrefix}Unit('kk')">kuukautta</button>
                    <button type="button" class="btn-ghost ${yksikko==='v'?'on':''}" onclick="${actionPrefix}Unit('v')">vuotta</button>
                </div>
            </div>
        </div>

        <label for="${pre}RxStart${sfx}">Jakso alkoi</label>
        <input type="date" id="${pre}RxStart${sfx}" value="${esc(arvot.rxStart)}">
        <div class="hint">Yleensä reseptin määräyspäivä. Tästä lasketaan milloin reseptiin kirjattu annos on käytetty.</div>`;
    } else if(tyyppi === 'amount'){
        kentat = `
        <label for="${pre}Units${sfx}">Yhteensä reseptillä (${esc(fi.unit)})</label>
        <input type="number" id="${pre}Units${sfx}" min="1" step="1" placeholder="esim. 300" value="${esc(arvot.units)}">

        <label for="${pre}UsedUnits${sfx}">Josta jo käytetty (${esc(fi.unit)})</label>
        <input type="number" id="${pre}UsedUnits${sfx}" min="0" step="1" value="${esc(arvot.usedUnits)}">
        <div class="hint">Kun aloitat uuden pakkauksen, pakkauksen määrä lisätään käytettyihin automaattisesti.</div>`;
    } else {
        kentat = `<div class="hint">Reseptin määrää ei seurata — vain voimassaolo.</div>`;
    }

    return `<label style="margin-top:1rem">Reseptin määrä</label>
        ${chips}
        ${kentat}`;
}

function renderNewPackageForm(m){
    const today = getTodayString();
    const d = settings.defaults || {};
    const fi = formInfo(m);
    const track = tracksDoses(m);
    // Vihje kertoo mihin laskuriin tämä pakkaus vaikuttaa. Ajanjaksoon
    // perustuvalla reseptillä ei ole pakkausmäärää, joten siitä ei
    // puhuta – haetut pakkaukset merkitään silti muistiin.
    const rxTyyppi = rxTypeOf(m);
    let rxHint;
    if(!m.prescriptionValidUntil){
        rxHint = `Tälle lääkkeelle ei ole asetettu reseptiä.`;
    } else if(rxTyyppi === 'packages'){
        rxHint = `Reseptillä käytetty ${m.prescriptionPackagesUsed||0}${m.prescriptionTotalPackages ? '/'+m.prescriptionTotalPackages : ''} pakkausta — tämä pakkaus kasvattaa laskuria automaattisesti.`;
    } else if(rxTyyppi === 'duration'){
        const loppu = rxPeriodEnd(m);
        rxHint = `Tämä on ${(m.prescriptionPackagesUsed||0) + 1}. pakkaus tällä reseptillä.`
               + (loppu ? ` Reseptin ${esc(rxAmountText(m))} riittää ${formatDate(loppu)} asti.` : '');
    } else if(rxTyyppi === 'amount'){
        const jaljella = rxUnitsRemaining(m);
        rxHint = `Reseptillä jäljellä ${jaljella === null ? '?' : jaljella} ${esc(fi.unit)} — pakkauksen määrä vähennetään automaattisesti.`;
    } else {
        rxHint = `Reseptin määrää ei seurata, vain voimassaoloa.`;
    }

    const maarat = track ? `
            <div class="pkg-form-row">
                <div>
                    <label for="pkgSize_${m.id}">${fi.unit === 'ml' ? 'Nestettä (ml)' : fi.unit.charAt(0).toUpperCase()+fi.unit.slice(1)}</label>
                    <input type="number" id="pkgSize_${m.id}" min="1" step="1" value="${esc(m.packageSize || d.packageSize || '')}">
                </div>
                <div>
                    <label for="pkgDose_${m.id}">Annos päivässä</label>
                    <input type="number" id="pkgDose_${m.id}" min="0.5" step="0.5" value="${esc(m.dosePerDay || d.dosePerDay || '')}">
                </div>
            </div>` : `
            <div class="hint" style="margin-bottom:.2rem">${fi.icon} ${fi.name}: määriä ei kysytä, koska riittoa ei lasketa.</div>`;

    return `<div class="pkg-form-card">
        <div class="pkg-form-header">
            <span class="pkg-form-tag">🆕 UUSI PAKKAUS</span>
            <h3>${esc(m.name)}</h3>
        </div>
        <div class="pkg-form-body">
            <div class="hint" style="margin-bottom:.6rem">Edellinen pakkaus siirtyy historiaan. ${rxHint}</div>

            ${maarat}

            <label for="pkgStart_${m.id}">Aloituspäivä</label>
            <input type="date" id="pkgStart_${m.id}" value="${today}">

            <div class="form-error" id="pkgError_${m.id}"></div>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="cancelNewPackage()">Peruuta</button>
                <button class="btn btn-primary" onclick="saveNewPackage('${m.id}')">Tallenna</button>
            </div>
        </div>
    </div>`;

function packageBadge(days){
    if(days === null) return '';
    if(days <= settings.packageCriticalDays) return `<span class="badge badge-package-critical">🔴 Pakkaus ${days<=0?'on loppunut':'loppuu '+days+' pv kuluttua'}</span>`;
    if(days <= settings.packageWarningDays)  return `<span class="badge badge-package-warning">🟡 Pakkaus loppumassa (${days} pv)</span>`;
    return '';
}
function rxBadge(days){
    if(days === null) return '';
    if(days <= settings.rxCriticalDays) return `<span class="badge badge-rx-critical">🔴 Resepti ${days<=0?'on vanhentunut':'vanhenee '+days+' pv kuluttua'}</span>`;
    if(days <= settings.rxWarningDays)  return `<span class="badge badge-rx-warning">🟡 Resepti vanhenemassa (${days} pv)</span>`;
    return '';
}
// Reseptin määrän merkki. Muoto riippuu siitä miten määrä on
// kirjattu: pakkauksina, hoitojaksona vai yksikköinä.
function refillBadge(m){
    const tyyppi = rxTypeOf(m);

    if(tyyppi === 'packages'){
        if(!m.prescriptionTotalPackages) return '';
        const remaining = getPrescriptionPackagesRemaining(m);
        if(remaining <= 0) return `<span class="badge badge-rx-critical">🔴 Resepti käytetty loppuun (${m.prescriptionPackagesUsed}/${m.prescriptionTotalPackages})</span>`;
        if(remaining === 1) return `<span class="badge badge-rx-warning">🟡 Reseptillä 1 pakkaus jäljellä (${m.prescriptionPackagesUsed}/${m.prescriptionTotalPackages})</span>`;
        return `<span class="badge badge-neutral">🧾 Reseptillä jäljellä ${remaining} pakkausta (${m.prescriptionPackagesUsed}/${m.prescriptionTotalPackages})</span>`;
    }

    if(tyyppi === 'duration'){
        const paivat = rxPeriodDaysRemaining(m);
        const teksti = esc(rxAmountText(m));
        if(paivat === null) return teksti ? `<span class="badge badge-neutral">🗓️ ${teksti}</span>` : '';
        if(paivat <= 0) return `<span class="badge badge-rx-critical">🔴 ${teksti} on käytetty loppuun</span>`;
        if(paivat <= settings.rxCriticalDays) return `<span class="badge badge-rx-critical">🔴 ${teksti} loppuu ${paivat} pv kuluttua</span>`;
        if(paivat <= settings.rxWarningDays) return `<span class="badge badge-rx-warning">🟡 ${teksti} loppuu ${paivat} pv kuluttua</span>`;
        return `<span class="badge badge-neutral">🗓️ ${teksti} riittää ${formatDate(rxPeriodEnd(m))} asti (${paivat} pv)</span>`;
    }

    if(tyyppi === 'amount'){
        if(!m.rxTotalUnits) return '';
        const jaljella = rxUnitsRemaining(m);
        const yksikko = esc(formInfo(m).unit);
        const kaytetty = `${m.rxUsedUnits || 0}/${m.rxTotalUnits}`;
        if(jaljella <= 0) return `<span class="badge badge-rx-critical">🔴 Resepti käytetty loppuun (${kaytetty})</span>`;
        if(m.packageSize && jaljella <= m.packageSize) return `<span class="badge badge-rx-warning">🟡 Reseptillä jäljellä ${jaljella} ${yksikko} (${kaytetty})</span>`;
        return `<span class="badge badge-neutral">🔢 Reseptillä jäljellä ${jaljella} ${yksikko} (${kaytetty})</span>`;
    }

    return '';
}
function kauppaBadge(m){
    return onKauppalistalla(m.name) ? `<span class="badge badge-cart">🛒 Kauppalistalla</span>` : '';
}
function kauppaNappi(m){
    if(kauppaLisays === m.id)    return `<button class="btn btn-cart" disabled>🛒 Lisätään...</button>`;
    if(onKauppalistalla(m.name)) return `<button class="btn btn-cart" disabled>🛒 Jo kauppalistalla</button>`;
    return `<button class="btn btn-cart" onclick="lisaaKauppalistaan('${m.id}')">🛒 Lisää kauppalistaan</button>`;
}

// Kun reseptissä ei ole pakkausmäärää, haettujen pakkausten luku on
// silti hyödyllinen tieto: se kertoo monesko purkki on käytössä.
function pickupRow(m, f){
    if(!f.rx || !m.prescriptionValidUntil) return '';

    if(tyyppi === 'packages' || tyyppi === 'amount') return '';
    const haettu = m.prescriptionPackagesUsed || 0;
    if(haettu <= 0) return '';
    return `<div class="med-info-row">📦 Tällä reseptillä haettu ${haettu} pakkausta</div>`;

function downloadJson(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// Tuotavaa tiedostoa ei koskaan oteta käyttöön suoraan: siitä
// näytetään ensin yhteenveto ja vasta vahvistus kirjoittaa tiedot.
window.handleImportFile = (input, kind) => {
    const file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const parsed = JSON.parse(reader.result);
            const medicines = (parsed.data && parsed.data.medicines) || parsed.medicines || null;
            const sets      = (parsed.data && parsed.data.settings)  || parsed.settings  || null;

            if(kind === 'settings'){
                if(!sets || typeof sets !== 'object') throw new Error('ei asetuksia');
                pendingImport = { kind:'settings', settings: sets, file: file.name, exportedAt: parsed.exportedAt || null };
            } else {
                if(!medicines || typeof medicines !== 'object') throw new Error('ei lääkkeitä');
                pendingImport = { kind:'full', medicines, settings: sets, file: file.name, exportedAt: parsed.exportedAt || null };
            }
            ui.settingsSection = 'tiedot';
            render();
        } catch(e){
            pendingImport = { kind:'error', file: file.name, message:'Tiedostoa ei voitu lukea. Varmista että se on tästä sovelluksesta ladattu JSON-tiedosto.' };
            ui.settingsSection = 'tiedot';
            render();
        }
    };
    reader.onerror = () => {
        pendingImport = { kind:'error', file: file.name, message:'Tiedoston lukeminen epäonnistui.' };
        render();
    };
    reader.readAsText(file);
};
window.cancelImport = () => { pendingImport = null; render(); };
window.confirmImport = async () => {
    if(!pendingImport || pendingImport.kind === 'error') return;

    if(pendingImport.kind === 'settings'){
        settings = cloneSettings({ ...settings, ...pendingImport.settings });
        data.settings = settings;
        applyTheme();
    } else {
        const meds = {};
        Object.entries(pendingImport.medicines).forEach(([id, m]) => {
            if(!m || typeof m !== 'object' || !m.name) return;
            meds[id] = {
                name: String(m.name),
                mode: m.mode === 'asNeeded' ? 'asNeeded' : 'daily',
                packageSize: m.packageSize || null,
                dosePerDay: m.dosePerDay || null,
                startDate: m.startDate || null,
                prescriptionValidUntil: m.prescriptionValidUntil || null,
                prescriptionTotalPackages: m.prescriptionTotalPackages || null,
                prescriptionPackagesUsed: m.prescriptionPackagesUsed || 0
            };
        });
        data.medicines = meds;
        if(pendingImport.settings){
            settings = cloneSettings({ ...settings, ...pendingImport.settings });
            data.settings = settings;
            applyTheme();
        }
    }
    pendingImport = null;
    legacyDataDetected = false;
    await saveData();
    showSaveStatus('✅ Tiedot tuotu', '#22c55e');
    render();
};

function switchRow(label, sub, on, action){
    return `<div class="set-row">

        <button class="switch ${on ? 'on' : ''}" onclick="${action}" role="switch" aria-checked="${on}" aria-label="${esc(label)}"></button>

}

function group(key, icon, title, body){

}

function renderDashboard(){
    const allMeds = Object.entries(data.medicines).map(([id,m]) => ({ id, ...m }));
    const dailyMeds = allMeds.filter(m => (m.mode || 'daily') === 'daily');
    const asNeededMeds = allMeds.filter(m => m.mode === 'asNeeded');

    dailyMeds.sort((a,b) => {
        const da = getPackageDaysRemaining(a), db = getPackageDaysRemaining(b);
        if(da === null && db === null) return a.name.localeCompare(b.name);
        if(da === null) return 1;
        if(db === null) return -1;
        return da - db;
    });
    asNeededMeds.sort((a,b) => {
        const da = getPrescriptionDaysRemaining(a), db = getPrescriptionDaysRemaining(b);
        if(da === null && db === null) return a.name.localeCompare(b.name);
        if(da === null) return 1;
        if(db === null) return -1;
        return da - db;
    });

    let html = '';
    if(legacyDataDetected && allMeds.length === 0){
        html += `<div class="info-banner">ℹ️ Sovellus päivitettiin tukemaan useita lääkkeitä. Aiempaa yhden lääkkeen dataa ei voitu muuntaa automaattisesti – lisää lääkkeesi uudelleen alta.</div>`;
    }

    if(ui.addFormOpen){
        html += renderAddForm();
    } else {
        html += `<button class="btn btn-primary" onclick="showAddMedicineForm()">➕ Lisää uusi lääke</button>`;
    }

    // Hakukenttä. Näkyy kun lääkkeitä on vähintään kaksi.
    if(settings.showSearch !== false && allMeds.length >= 2){
        html += `<div class="search-box">
            <span class="mag">🔍</span>
            <input type="text" id="medSearch" placeholder="Hae lääkettä…" autocomplete="off"
                   value="${esc(ui.search || '')}" oninput="onSearchInput(this.value)">
            <button class="clear" id="searchClear" onclick="clearSearch()"
                    style="${ui.search ? '' : 'display:none'}" aria-label="Tyhjennä haku">✕</button>
        </div>`;
    }

    // Kategoriasuodatin. Näkyy vasta kun molempia tyyppejä on olemassa,
    // jottei yhden lääkkeen listan päällä ole turhaa valikkoa.
    const molemmat = dailyMeds.length > 0 && asNeededMeds.length > 0;
    const naytaKaikki = !!settings.showAllFilter;
    const suodatin = activeCategory(molemmat);

    if(molemmat){
        html += `<div class="filter-row" id="filterRow">
            ${naytaKaikki ? `<button class="fchip ${suodatin==='all'?'on':''}" data-cat="all" onclick="setMedFilter('all')">Kaikki <span class="n">${allMeds.length}</span></button>` : ''}
            <button class="fchip ${suodatin==='daily'?'on':''}" data-cat="daily" onclick="setMedFilter('daily')">💊 Päivittäin <span class="n">${dailyMeds.length}</span></button>
            <button class="fchip ${suodatin==='asNeeded'?'on':''}" data-cat="asNeeded" onclick="setMedFilter('asNeeded')">🕐 Tarvittaessa <span class="n">${asNeededMeds.length}</span></button>
        </div>
        <div class="search-note" id="searchNote" style="display:none">Haku etsii kaikista lääkkeistä kategoriasta riippumatta.</div>`;
    }

    if(allMeds.length === 0){
        html += `<div class="empty-state">Ei vielä lisättyjä lääkkeitä.<br>Lisää ensimmäinen lääke yllä olevasta napista.</div>`;
    } else {
        // Molemmat ryhmät piirretään aina. Suodatus ja haku tehdään
        // valmiille korteille, jolloin kirjoittaminen ei piirrä listaa
        // uusiksi eikä kenttä menetä kohdistusta.
        if(dailyMeds.length){
            html += `<div class="med-group" data-group="daily">
                <h2 class="section-title">💊 Päivittäin käytettävät</h2>
                <div class="med-list">`;
            dailyMeds.forEach((m, idx) => { html += renderMedCard(m, idx === 0 && !ui.addFormOpen); });
            html += `</div></div>`;
        }
        if(asNeededMeds.length){
            html += `<div class="med-group" data-group="asNeeded">
                <h2 class="section-title">🕐 Tarvittaessa käytettävät</h2>
                <div class="med-list">`;
            asNeededMeds.forEach(m => { html += renderAsNeededCard(m); });
            html += `</div></div>`;
        }
        html += `<div class="empty-state is-hidden" id="searchEmpty">Haulla ei löytynyt lääkkeitä.</div>`;
    }
    document.getElementById('app').innerHTML = html;
    applyListFilters();
}

// Voimassa oleva kategoria. Ilman Kaikki-nappia listalla on aina
// jokin ryhmä valittuna, ja jos vain toista tyyppiä on olemassa,
// suodatin ohitetaan ettei ruutu jää tyhjäksi.
function activeCategory(molemmat){
    if(molemmat === false) return 'all';
    let v = ui.medFilter || (settings.showAllFilter ? 'all' : 'daily');
    if(!settings.showAllFilter && v === 'all') v = 'daily';
    return v;
}

// Hakusana ja kategoria suodattavat samoja kortteja. Haun aikana
// kategoria ohitetaan, jotta toisesta ryhmästä löytyvä lääke ei jää
// piiloon vain siksi että väärä nappi on valittuna.
function applyListFilters(){
    const app = document.getElementById('app');
    if(!app) return;
    const ryhmat = app.querySelectorAll('.med-group');
    if(!ryhmat.length) return;

    const q = normSearch((ui.search || '').trim());
    const molemmat = ryhmat.length > 1;
    const kategoria = activeCategory(molemmat);

    let nakyvia = 0;
    const nakyvatRyhmat = [];

    ryhmat.forEach(ryhma => {
        const kategoriaOk = q ? true : (kategoria === 'all' || kategoria === ryhma.dataset.group);
        let ryhmassa = 0;
        ryhma.querySelectorAll('[data-search]').forEach(kortti => {
            const osuma = kategoriaOk && (!q || kortti.dataset.search.indexOf(q) > -1);
            kortti.classList.toggle('is-hidden', !osuma);
            if(osuma) ryhmassa++;
        });
        // Avoin lomake pidetään aina näkyvissä, vaikka haku ei osuisi.
        const lomakkeita = ryhma.querySelectorAll('.form-card, .pkg-form-card').length;
        const ryhmaNakyy = ryhmassa > 0 || lomakkeita > 0;
        ryhma.classList.toggle('is-hidden', !ryhmaNakyy);
        if(ryhmaNakyy) nakyvatRyhmat.push(ryhma);
        nakyvia += ryhmassa;
    });

    // Ryhmän otsikko on turha kun näkyvissä on vain yksi ryhmä.
    nakyvatRyhmat.forEach(ryhma => {
        const otsikko = ryhma.querySelector('.section-title');
        if(otsikko) otsikko.style.display = nakyvatRyhmat.length === 1 ? 'none' : '';
    });

    const tyhja = document.getElementById('searchEmpty');
    if(tyhja) tyhja.classList.toggle('is-hidden', nakyvia > 0);

    const note = document.getElementById('searchNote');
    if(note) note.style.display = q ? '' : 'none';

    const clr = document.getElementById('searchClear');
    if(clr) clr.style.display = (ui.search || '') ? '' : 'none';
}

window.onSearchInput = (v) => { ui.search = v; applyListFilters(); };
window.clearSearch = () => {
    ui.search = '';
    const el = document.getElementById('medSearch');
    if(el){ el.value = ''; el.focus(); }
    applyListFilters();
};

window.setMedFilter = (v) => {
    ui.medFilter = v;
    // Vain nappien tila ja korttien näkyvyys muuttuvat, joten listaa
    // ei piirretä uusiksi eikä vieritys hyppää alkuun.
    document.querySelectorAll('#filterRow .fchip').forEach(b => {
        b.classList.toggle('on', b.dataset.cat === v);
    });
    applyListFilters();
};

// ============================================================
function render(){
    document.querySelectorAll('.tabbar button').forEach(b => {
        b.classList.toggle('on', b.dataset.tab === ui.view);
    });

    if(ui.view === 'prescriptions'){ renderPrescriptionsView(); return; }
    if(ui.view === 'settings'){
        if(!settingsUnlocked){ renderPinView(); return; }
        renderSettingsView(); return;
    }
    renderDashboard();
}

document.querySelectorAll('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        if(ui.view === tab && tab === 'dashboard'){ window.scrollTo({ top:0, behavior:'smooth' }); return; }
        ui.view = tab;
        ui.addFormOpen = false; ui.editId = null; ui.newPackageId = null; ui.newRxId = null;
        ui.pinInput = ''; ui.pinError = '';
        if(tab === 'settings' && !ui.settingsSection) ui.settingsSection = 'ulkoasu';
        render();
        window.scrollTo({ top:0 });
    });
});

applyTheme();

// ============================================================
//  SERVICE WORKER JA PÄIVITYKSET
//  Worker rekisteröidään versionumeron kanssa, joten uusi julkaisu
//  tunnistetaan aina. Sivua ei ladata uudelleen itsestään – siitä
//  kerrotaan palkissa, jotta kesken oleva täyttö ei katoa alta.
// ============================================================
if('serviceWorker' in navigator){
    window.addEventListener('load', async () => {
        try {
            const hadController = !!navigator.serviceWorker.controller;
            const reg = await navigator.serviceWorker.register('./sw.js?v=' + APP_VERSION);

            const kerroPaivityksesta = () => {
                if(hadController) document.getElementById('updateBar').classList.add('show');
            };
            navigator.serviceWorker.addEventListener('controllerchange', kerroPaivityksesta);
            reg.addEventListener('updatefound', () => {
                const nw = reg.installing;
                if(!nw) return;
                nw.addEventListener('statechange', () => {
                    if(nw.state === 'activated' || nw.state === 'installed') kerroPaivityksesta();
                });
            });

            // Tarkistetaan päivitykset kun sovellus palaa näkyviin.
            document.addEventListener('visibilitychange', () => {
                if(!document.hidden) reg.update().catch(() => {});
            });
            setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
        } catch(e){
            console.warn('Service workerin rekisteröinti epäonnistui', e);
        }
    });
}
document.getElementById('updateNow').addEventListener('click', () => location.reload());
document.getElementById('updateLater').addEventListener('click', () => {
    document.getElementById('updateBar').classList.remove('show');
});
</script>
